<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5EFF">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SkoliData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--blue:#1E5EFF;--deep:#1748D6;--light:#5AA2FF;--pale:#E8F1FF;--navy:#0B1F44;--slate:#5B6987;--ground:#F3F6FC;--line:#DCE4F2;--soft:#A9C8FF;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--navy);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:800}
p{margin:0;line-height:1.45}
.sub{font-size:15px;font-weight:600;color:var(--slate)}
.card{background:var(--white);border:1px solid #E4EBF7;border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(11,31,68,.04),0 8px 24px rgba(11,31,68,.05)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;border:none;font:700 17px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;padding:0 16px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.primary{background:var(--blue);color:#fff}
.secondary{background:#fff;color:var(--deep);border:1.5px solid #C9D8F8}
.text{background:none;color:var(--deep);min-height:44px;width:auto;padding:0 6px}
.korsem{min-height:76px;border-radius:24px;background:linear-gradient(135deg,#3D7DFF 0%,#1E5EFF 55%,#1646D0 100%);color:#fff;font-size:24px;font-weight:800;box-shadow:0 14px 30px rgba(30,94,255,.3)}
.klinisyen{min-height:76px;border-radius:24px;background:#fff;color:var(--navy);border:2px solid var(--blue);font-size:22px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{background:none;border:none;color:var(--deep);font:700 17px 'Plus Jakarta Sans',system-ui;display:flex;align-items:center;gap:4px;min-height:44px;padding:0;cursor:pointer}
.pill{align-self:center;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 18px;border-radius:22px;background:#fff;border:1px solid #E4EBF7;font-weight:700;font-size:16px;text-align:center}
.dot{width:10px;height:10px;border-radius:5px;background:var(--blue);box-shadow:0 0 0 4px rgba(30,94,255,.18);flex:none}
.dot.off{background:none;border:2px solid var(--slate);box-shadow:none}
.dot.wait{background:var(--soft);box-shadow:none}
.dot.maybe{background:#8C9AB8;box-shadow:0 0 0 4px rgba(140,154,184,.2)}
.note.neutral{background:#F2F4F8;border-color:#DDE2EC;color:#3D4A66}
.ringwrap{position:relative;width:220px;height:220px;align-self:center}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big{font-weight:800;letter-spacing:-.03em;display:flex;align-items:baseline;gap:3px}
.big b{font-size:40px;line-height:1}.big i{font-style:normal;font-size:18px;margin-right:5px}
.goal{font-size:15px;font-weight:700;color:var(--slate)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--slate)}
.wd span:first-child{width:32px;height:32px;border-radius:16px;border:2px dashed var(--line)}
.wd.done span:first-child{background:var(--blue);border:none}
.wd.miss span:first-child{border:2.5px solid var(--soft)}
.wd.today span:first-child{border:2.5px solid var(--blue);display:flex;align-items:center;justify-content:center}
.wd.today.done span:first-child{border:none}
.wd.today span:first-child::after{content:'';width:10px;height:10px;border-radius:5px;background:var(--blue)}
.wd.today.done span:first-child::after{background:#fff}
.wd.today{color:var(--navy);font-weight:800}
.upd{text-align:center;font-size:14px;font-weight:600;color:var(--slate)}
.note{background:var(--pale);border:1px solid #D3E2FD;border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.45;color:#34446A}
.note b{display:block;color:var(--navy);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat span{display:block;font-size:13px;font-weight:700;color:var(--slate)}.stat b{font-size:22px;font-weight:800}
.small{font-size:13px;color:var(--slate);line-height:1.45}
.center{text-align:center}
.mark{width:84px;height:84px;border-radius:42px;background:linear-gradient(135deg,var(--light),var(--blue));display:flex;align-items:center;justify-content:center;align-self:center;box-shadow:0 12px 30px rgba(30,94,255,.28)}
.mark span{width:32px;height:32px;border-radius:16px;border:5px solid #fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--slate)}
input.in{height:54px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:600 17px 'Plus Jakarta Sans',system-ui;color:var(--navy);background:#fff;width:100%}
input.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,94,255,.12)}
.err{color:var(--deep);font-weight:700;font-size:14px;min-height:20px}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:48px;height:48px;border-radius:24px;border:none;background:var(--pale);color:var(--deep);font:800 24px system-ui;cursor:pointer}
.stepper b{font-size:26px;font-weight:800}
.list{display:flex;flex-direction:column}
a.li{text-decoration:none}
main a:not(.li){color:#1E5EFF;text-decoration:none;font-weight:600}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid #EEF2F9;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.li:last-child{border-bottom:none}
.li .k{font-weight:700}.li .v{color:var(--slate);font-weight:600;font-size:15px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pale);color:var(--deep);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.4;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--blue);flex:none;margin:0}
.gauge{display:flex;gap:4px}.gauge i{flex:1;height:10px;border-radius:5px;background:var(--line)}.gauge i.on{background:var(--blue)}
pre.log{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.4;margin:8px 0 0;max-height:200px;overflow:auto;background:var(--ground);border-radius:12px;padding:10px}
svg.chart{width:100%;height:auto;display:block}
button.chip{border:1px solid #D3E2FD;cursor:pointer;min-height:32px;font:inherit;font-size:13px;font-weight:700}
button.chip.on{background:var(--deep);color:#fff;border-color:var(--deep)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.legend{font-size:12px;color:var(--slate);margin-top:6px;line-height:1.5}
.help{font-size:12.5px;color:var(--slate);margin:4px 0 0;line-height:1.4}
table.cmp{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}table.cmp td,table.cmp th{padding:6px 4px;border-bottom:1px solid #EEF2F9;text-align:right}table.cmp td:first-child,table.cmp th:first-child{text-align:left}
.warn{background:#FFF;border:1px solid #D3E2FD;border-left:4px solid var(--deep);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:8px}
.timer{font-size:56px;font-weight:800;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:8px;justify-content:center}.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:90vw;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="skolidata-algo.js"></script>
<script>
'use strict';
const APP_VERSION = 'app v1.17 · algo ' + SkoliAlgo.INFO.id;
// ---------- what people see for a button: its name ("SkoliData 3", numbered by the server). Only the owner also sees the SK code ----------
const isOwnerView = () => !!(window.SRV_ON && typeof SRV !== 'undefined' && SRV.profile && SRV.profile.role === 'owner');
function btnName(code) {
  const l = window.SRV_ON && typeof SRV !== 'undefined' && SRV.labels && SRV.labels[code]; if (l) return l;
  const n = getMeta(code).bleName; return n && n !== code ? n : null;
}
function btnText(code) {
  if (!code) return '';
  const n = btnName(code);
  if (!window.SRV_ON) return n || code;                    // demo mode without a server: there are no numbered names
  return isOwnerView() ? (n ? `${n} · ${code}` : code) : (n || 'SkoliData butonu');
}
const csvName = c => (isOwnerView() ? [btnName(c), c] : [btnName(c) || 'buton']).filter(Boolean).join('_').replace(/\s+/g, '_');
// clinician accounts made by SkoliData use a user name; behind the scenes it is <name>@klinisyen.skolidata.app (no mail is ever sent)
const CLIN_DOMAIN = '@klinisyen.skolidata.app';
const clinLoginEmail = u => { u = (u || '').trim().toLowerCase(); return u.includes('@') ? u : u + CLIN_DOMAIN; };
const showLogin = e => (e || '').endsWith(CLIN_DOMAIN) ? 'kullanıcı adı ' + e.slice(0, -CLIN_DOMAIN.length) : e;
// name + surname of the person who wears the brace (so the team can tell families apart)
const nameOk = n => (n || '').trim().split(/\s+/).filter(w => w.length >= 2).length >= 2;
const NAME_MSG = 'Ad ve soyadı yaz (örnek: Elif Yılmaz).';
// contact (SkoliData – Egemen Uludüz)
const CONTACT = { phone: '0 (538) 857 20 65', tel: '+905388572065', mail: 'egemenuluduzz@gmail.com' };
const CONTACT_TXT = `Telefon: ${CONTACT.phone} · E-posta: ${CONTACT.mail}`;
const CONTACT_HTML = `<a href="tel:${CONTACT.tel}">${CONTACT.phone}</a> · <a href="mailto:${CONTACT.mail}">${CONTACT.mail}</a>`;
const SK_SVC = '508d0001-ade4-4fb4-9f46-45ea6a7e9c8f', SK_RX = '508d0002-ade4-4fb4-9f46-45ea6a7e9c8f', SK_TX = '508d0003-ade4-4fb4-9f46-45ea6a7e9c8f';   // SkoliData's own Bluetooth service
// Clinician accounts: only a salted SHA-256 of the password is stored here (never the password itself).
// NOTE: this is a front door for testing, not real security; real accounts need the server (master plan §6-7).
const CLINICIANS = [{ u: 'klinisyen', salt: '5421f45dc65f8046e7b1231c5b5fc80f', hash: 'e4a095d63996a4ced0aa39f2d3f0633b469adc340db00dc81c4b7dc6f3d909c1', name: 'Klinisyen' }];
const DEFAULT_MODEL = SkoliAlgo.defaultModel();
const DAYS_TR = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
const MONTHS_TR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const WEEKDAYS_TR = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

// ================= small helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mem = {};
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); } catch (e) { return k in mem ? mem[k] : d; } }
function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
function ssGet(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return mem['ss' + k] || null; } }
function ssSet(k, v) { mem['ss' + k] = v; try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(pred, ms) { const end = Date.now() + ms; while (Date.now() < end) { if (pred()) return true; await sleep(50); } return !!pred(); }
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const dateKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtHM = ms => { const h = Math.floor(ms / 3.6e6), m = Math.floor((ms % 3.6e6) / 6e4); return `${h} sa ${m} dk`; };
const fmtH1 = ms => (ms / 3.6e6).toFixed(1).replace('.', ',');
const fmtDate = t => { const d = new Date(t); return `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`; };
function ago(t) { if (!t) return 'henüz yok'; const s = (Date.now() - t) / 1000; if (s < 60) return 'az önce'; if (s < 3600) return Math.floor(s / 60) + ' dk önce'; if (s < 86400) return Math.floor(s / 3600) + ' sa önce'; return Math.floor(s / 86400) + ' gün önce'; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => x.toString(16).padStart(2, '0')).join('');

// ================= storage =================
// small things in localStorage; readings in IndexedDB (falls back to memory)
const profiles = () => lsGet('sk.profiles', {});
const saveProfiles = p => lsSet('sk.profiles', p);
const getMeta = code => lsGet('sk.meta.' + code, { next: 0, lastSync: 0, mv: 0, firstSeen: Date.now() });
const setMeta = (code, m) => lsSet('sk.meta.' + code, m);
const getModel = code => lsGet('sk.model.' + code, null);
const modelFor = code => { const m = getModel(code); return m && SkoliAlgo.accepts(m) ? m : DEFAULT_MODEL; };   // a model from another algorithm version is not used

let DB = null, memRecs = null;
function idb() {
  return new Promise((res) => {
    if (DB || memRecs) return res(DB);
    try {
      const r = indexedDB.open('skolidata', 1);
      r.onupgradeneeded = () => { const st = r.result.createObjectStore('recs', { keyPath: ['code', 'idx'] }); st.createIndex('byTime', ['code', 't']); };
      r.onsuccess = () => { DB = r.result; res(DB); };
      r.onerror = () => { memRecs = []; res(null); };
    } catch (e) { memRecs = []; res(null); }
  });
}
async function putRecs(list) {
  if (!list.length) return;
  const db = await idb();
  if (!db) { memRecs.push(...list); return; }
  await new Promise((res) => { const tx = db.transaction('recs', 'readwrite'), st = tx.objectStore('recs'); list.forEach(r => st.put(r)); tx.oncomplete = res; tx.onerror = res; });
  // readings arrived for these days -> their cached hours must be recomputed
  const byCode = {};
  list.forEach(r => { byCode[r.code] = Math.min(byCode[r.code] ?? Infinity, r.t); });
  for (const c in byCode) {
    const k = dateKey(byCode[c]), cache = lsGet('sk.days.' + c, {}); for (const d in cache) if (d >= k) delete cache[d]; lsSet('sk.days.' + c, cache);
    const rk = 'sk.rawdirty.' + c, cur = lsGet(rk, null); if (cur === null || byCode[c] < cur) lsSet(rk, byCode[c]);   // raw readings to upload (server mode)
  }
}
async function getRecs(code, t0, t1) {
  const db = await idb();
  if (!db) return memRecs.filter(r => r.code === code && r.t >= t0 && r.t <= t1).sort((a, b) => a.t - b.t);
  return new Promise((res) => { const q = db.transaction('recs').objectStore('recs').index('byTime').getAll(IDBKeyRange.bound([code, t0], [code, t1])); q.onsuccess = () => res(q.result); q.onerror = () => res([]); });
}
async function deleteCode(code) {
  const db = await idb();
  if (!db) { memRecs = memRecs.filter(r => r.code !== code); return; }
  await new Promise((res) => { const tx = db.transaction('recs', 'readwrite'); tx.objectStore('recs').delete(IDBKeyRange.bound([code, 0], [code, Number.MAX_SAFE_INTEGER])); tx.oncomplete = res; tx.onerror = res; });
}

// ================= raw readings as one compact file per day (for the server) =================
// JSON of differences (time s, skin x100, humidity x2, cover (x+20)x2), gzip + base64 when the browser can (~50 KB a day)
const canGz = typeof CompressionStream !== 'undefined' && typeof DecompressionStream !== 'undefined';
const b64enc = u8 => { let t = ''; for (let i = 0; i < u8.length; i += 0x8000) t += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(t); };
const b64dec = str => Uint8Array.from(atob(str), ch => ch.charCodeAt(0));
async function gzipBytes(u8, inflate) { const st = new Blob([u8]).stream().pipeThrough(inflate ? new DecompressionStream('gzip') : new CompressionStream('gzip')); return new Uint8Array(await new Response(st).arrayBuffer()); }
function packDay(recs) {
  const d = a => a.map((v, i) => i ? v - a[i - 1] : v);
  return JSON.stringify({ v: 1, t: d(recs.map(r => Math.round(r.t / 1000))), s: d(recs.map(r => r.skin === null ? -32768 : Math.round(r.skin * 100))),
    h: d(recs.map(r => r.rh === null ? 255 : Math.round(r.rh * 2))), c: d(recs.map(r => Math.round((r.chip + 20) * 2))) });
}
function unpackDay(json, code) {
  const o = JSON.parse(json), u = a => { let x = 0; return a.map(v => (x += v)); };
  const t = u(o.t), sk = u(o.s), h = u(o.h), c = u(o.c);
  return t.map((tt, i) => ({ code, t: tt * 1000, skin: sk[i] === -32768 ? null : sk[i] / 100, rh: h[i] === 255 ? null : h[i] / 2, chip: c[i] / 2 - 20, remote: true }));
}
async function encodeDay(recs) { const json = packDay(recs); return canGz ? { enc: 'gz64', data: b64enc(await gzipBytes(new TextEncoder().encode(json))) } : { enc: 'json', data: json }; }
async function decodeRawRow(row, code) { return unpackDay(row.enc === 'json' ? row.data : new TextDecoder().decode(await gzipBytes(b64dec(row.data), true)), code); }
// readings for a time window: this device's own, filled in from the server where this device has none
const RAWCACHE = {};
async function getRecsAny(code, t0, t1, fidIn) {
  const local = await getRecs(code, t0, t1);
  if (!window.SRV_ON || !SRV.user || !SRV.profile) return local;
  const P = profiles()[code] || {}, fid = SRV.profile.role === 'family' ? SRV.user.id : (fidIn || P.familyId);
  if (!fid) return local;
  try {
    const ck = [fid, dateKey(t0), dateKey(t1)].join('|'), hit = RAWCACHE[ck];
    const rows = hit && Date.now() - hit.at < 300e3 ? hit.rows : (SRV.profile.role === 'owner'
      ? await SRV.rpc('owner_raw_days', { p_family: fid, p_from: dateKey(t0), p_to: dateKey(t1) })
      : await sv(SRV.sb.from('raw_days').select('*').eq('family_id', fid).gte('day', dateKey(t0)).lte('day', dateKey(t1))));
    if (!hit || hit.rows !== rows) RAWCACHE[ck] = { at: Date.now(), rows };
    const have = new Set(local.map(r => Math.round(r.t / 1000))), extra = [];
    for (const row of rows) if (!row.button_code || row.button_code === code) for (const r of await decodeRawRow(row, code)) if (r.t >= t0 && r.t <= t1 && !have.has(Math.round(r.t / 1000))) extra.push(r);
    return extra.length ? local.concat(extra).sort((a, b) => a.t - b.t) : local;
  } catch (e) { blog('sunucu ham veri: ' + (e.message || e)); return local; }
}

// ================= Bluetooth (protocol 2) =================
const B = { device: null, rx: null, connected: false, info: null, chunk: null, syncing: false, live: null, log: [], writeQ: Promise.resolve(), rxBuf: new Uint8Array(0), binLeft: 0, pend: [], rawT: 0 };
const fwAtLeast = (fw, maj, min) => { const m = /fw(\d+)\.(\d+)/.exec(fw || ''); return !!m && (+m[1] > maj || (+m[1] === maj && +m[2] >= min)); };
const syncText = () => 'Buton okunuyor…' + (B.syncing && B.progress > 0.02 && B.progress < 1 ? ' %' + Math.round(B.progress * 100) : '');
function blog(t) { B.log.push(new Date().toLocaleTimeString('tr-TR') + '  ' + t); if (B.log.length > 40) B.log.shift(); }
function send(cmd) {

// ================= wear hours per day (cached for finished days) =================
const DAYCACHE = {};   // code -> {key -> day}
async function computeDays(code, nDays = 14, force) {
  const model = modelFor(code), meta = getMeta(code);

  for (let d = nDays - 1; d >= 0; d--) {
    const a = addDays(today0, -d), b = addDays(today0, -d + 1), key = dateKey(a), isToday = d === 0;
    const c = cache[key];
    if (!isToday && c && c.modelAt === model.createdAt) { out[key] = c; continue; }
    const recs = await getRecs(code, a - 30 * 60e3, Math.min(b, Date.now() + 60e3));
    const prev = DAYCACHE[code] && DAYCACHE[code][key];
    if (recs.length <= 1 && prev && prev.fromServer) { out[key] = prev; continue; }
    const day = { key, start: a, ms: 0, unsureMs: 0, dataMs: 0, segs: [], n: 0, modelAt: model.createdAt };
    if (recs.length > 1) {
      const r = SkoliAlgo.classify(recs, model), st = r.states;
      for (let i = 0; i < st.length - 1; i++) {
        const x = Math.max(st[i].t, a), y = Math.min(st[i + 1].t, b);
        if (y <= x || st[i].gapAfter) continue;
        day.dataMs += y - x;
        if (st[i].unsure) day.unsureMs += y - x; else if (st[i].state === 'on') day.ms += y - x;
      }
      day.segs = r.segments.filter(s => s.state === 'on' && s.to > a && s.from < b).map(s => [Math.max(s.from, a), Math.min(s.to, b)]);
      day.n = recs.filter(x => x.t >= a).length;
    }
    out[key] = day;
    if (!isToday && meta.lastSync > b) cache[key] = day;     // finished day, synced after it ended
  }
  lsSet('sk.days.' + code, cache);
  const cur = DAYCACHE[code] || {};
  for (const k in out) if (!(out[k].dataMs > 0) && cur[k] && cur[k].fromServer) out[k] = cur[k];

}

// ================= battery estimate =================
function battery(code) {
  const m = getMeta(code), mv = m.mv || 0;
  if (!mv) return { txt: 'Henüz bilinmiyor', seg: 0 };
  if (mv >= 3150) return { txt: 'USB ile çalışıyor', seg: 5 };
  const monthsUsed = (Date.now() - (m.firstSeen || Date.now())) / (30.4 * 864e5);
  if (mv < 2600) return { txt: 'Pil bitmek üzere. SkoliData ile iletişime geç.', seg: 1, low: true };
  if (mv < 2750) return { txt: 'Pil azalıyor. SkoliData ile iletişime geç.', seg: 2, low: true };
  const left = Math.max(1, Math.round(12 - monthsUsed));
  return { txt: `Yaklaşık ${left} ay kaldı`, seg: Math.max(3, Math.min(5, Math.ceil(left / 2.4))) };
}

function calBeginStep(i) {

// ---------- chart: temperature + what the algorithm decided + its lines (any algorithm: uses overlays/classify only) ----------
function rawChartSvg(recs, model, t0, t1, o = {}) {

    for (const x of st) { const k = x.gapAfter ? null : x.unsure ? 'u' : x.state === 'on' ? 'on' : null, tt = Math.min(t1, Math.max(t0, x.t)); if (k !== cur) { put(cur, a, tt); cur = k; a = tt; } }

  const lineSvg = lines.map(l => l.kind === 'ref' ? hl(l, '#9AA6BF', '1 3', 1) : hl(l, o.compare ? '#1E5EFF' : '#0B1F44', l.kind === 'on' ? '5 3' : '2 3', o.compare ? 1.6 : 1.2)).join('')
    + old.map(l => `<line x1="0" x2="${W}" y1="${Y(l.value)}" y2="${Y(l.value)}" stroke="#8C9AB8" stroke-dasharray="2 2" stroke-width="1"/>`).join('');
  const span = t1 - t0, tl = t => span > 30 * 3.6e6 ? `${fmtDate(t)} ${new Date(t).toTimeString().slice(0, 5)}` : new Date(t).toTimeString().slice(0, 5);

// ---------- live temperature (optional; needs the button nearby) ----------
B.liveBuf = [];
// ---------- live words for the family: what the temperature is doing right now (no numbers are shown) ----------
// Separate from the hours algorithm. Uses only the last 15 minutes of live readings (every 2 s), smoothed with a
// 10-second median so a single spike counts for nothing. Rules (numbers in LIVE_RULES):
//   FAST RISE  : up >= 2 °C within 3 min  -> "takıyor olabilirsin"   (skin contact warms the button fast: tau ~100 s)
//   FAST FALL  : down >= 2 °C within 3 min -> "çıkarmış olabilirsin"
//   SLOW RISE  : up >= 2 °C over 15 min with no fast rise, and not coming down (within 0.5 °C of its top for 5 min)
//                -> "emin değilim" (a warming room / car / heater warms slowly)
//   TOO HOT    : above 37 °C (warmer than skin under a brace can be) -> "emin değilim"
//   QUIET (10 min without one of the above): above the calibrated "takılı" line -> takılı görünüyor,
//                below the "çıkarıldı" line -> takmıyor gibisin; after a slow rise it stays "emin değilim" until it cools.
// The same message never repeats: a further rise after "takıyor olabilirsin" says nothing new.
const LIVE_RULES = { jumpC: 2.0, fastMin: 3, slowMin: 15, settleMin: 5, settleTolC: 0.5, quietMin: 10, tooHotC: 37 };
const LIVE_MSG = {
  up: 'Korseni takıyor olabilirsin.',
  again: 'Korseni yeniden takıyor olabilirsin.',
  down: 'Korseni çıkarmış olabilirsin.',
  unsure: 'Şu an emin değilim; ortam ısınıyor olabilir (araba, kalorifer, güneş).',
  on: 'Korsen takılı görünüyor. Süper gidiyorsun!',
  off: 'Şu an korseni takmıyor gibisin.',

const TREND = { code: null, raw: [], pts: [], kind: null, msg: null, at: 0, lastFast: 0, lastFastDir: null };
function noteTrend(r) {
  if (r.skin === null || !isFinite(r.skin)) return;

  else if (hi3 - T >= R.jumpC) { ev = 'down'; TREND.lastFast = now; TREND.lastFastDir = 'down'; }
  else if (now - TREND.lastFast > min(R.slowMin) && TREND.pts[0].t <= now - min(R.slowMin - 1)) {
    const lo15 = Math.min(...win(R.slowMin)), hi5 = Math.max(...win(R.settleMin));
    if (T - lo15 >= R.jumpC && hi5 - T <= R.settleTolC) ev = 'unsure';

    TREND.kind = kind; TREND.msg = LIVE_MSG[ev]; TREND.at = now; TREND.ev = ev;
    if (session && session.role === 'family' && screen === 'famHome') toast(TREND.msg + (kind === 'unsure' ? '' : ` ${LIVE_RULES.quietMin} dakika içinde tam olarak anlayacağım.`));
  }

}
// what to show now: a recent change (neutral grey) or, when it has been quiet, the steady state
function liveStatus(code) {
  if (TREND.code !== code || TREND.T == null) return null;
  const model = modelFor(code), quiet = TREND.lastT - TREND.at > LIVE_RULES.quietMin * 60e3, T = TREND.T;
  if (!quiet && TREND.msg) {                // a change: say it, and when we will be sure ("10 dakika içinde tam olarak anlayacağım")
    const left = Math.max(1, Math.ceil((LIVE_RULES.quietMin * 60e3 - (TREND.lastT - TREND.at)) / 60e3));
    return { cls: 'maybe', text: TREND.kind === 'unsure' ? TREND.msg : `${TREND.msg} ${left} dakika içinde tam olarak anlayacağım.`, when: TREND.at };
  }
  if (T > LIVE_RULES.tooHotC || T > model.Ton + (model.hotterThanSkinC ?? SkoliAlgo.CFG.hotterThanSkinC)) return { cls: 'maybe', text: LIVE_MSG.unsure };

window.onSynced = async code => {
  if (!SRV.on || !SRV.profile || SRV.profile.role !== 'family' || SRV.profile.button_code !== code) return;
  const days = Object.values(DAYCACHE[code] || {}).filter(d => d.dataMs > 0 && !d.fromServer);
  const rows = days.map(d => ({ family_id: SRV.user.id, day: d.key, worn_min: Math.round(d.ms / 6e4), unsure_min: Math.round(d.unsureMs / 6e4),
    data_min: Math.min(1440, Math.round(d.dataMs / 6e4)), segments: d.segs.map(([a, b]) => [Math.round((a - d.start) / 6e4), Math.round((b - d.start) / 6e4)]),
    algo: SkoliAlgo.INFO.id, model_at: d.modelAt || 0, button_code: code, updated_at: new Date().toISOString() }));
  if (rows.length) await sv(SRV.sb.from('day_summaries').upsert(rows, { onConflict: 'family_id,day,button_code' }));
  const m = getMeta(code);
  await sv(SRV.sb.from('device_status').update({ mv: m.mv || null, fw: m.fw || null, flash: B.info ? !!B.info.flash : null,
    last_sync: new Date(m.lastSync || Date.now()).toISOString() }).eq('button_code', code));
  m.lastPush = Date.now(); setMeta(code, m);
  await SRV.uploadRaw(code);
};
// raw readings of the days that got new readings (max. last 7 days), one compressed file per day
SRV.uploadRaw = async code => {
  const k = 'sk.rawdirty.' + code, dirty = lsGet(k, null); if (dirty === null) return;
  for (let a = Math.max(startOfDay(dirty), addDays(startOfDay(Date.now()), -7)); a <= Date.now(); a = addDays(a, 1)) {
    const recs = await getRecs(code, a, addDays(a, 1) - 1); if (!recs.length) continue;
    const e = await encodeDay(recs);
    await sv(SRV.sb.from('raw_days').upsert({ family_id: SRV.user.id, button_code: code, day: dateKey(a), n: recs.length, enc: e.enc, data: e.data,
      updated_at: new Date().toISOString() }, { onConflict: 'family_id,button_code,day' }));
  }
  if (lsGet(k, null) === dirty) lsDel(k);       // newer readings that arrived meanwhile stay marked
};

window.onCalibrated = async (code, res, by, fidIn) => {
  if (!SRV.on || !SRV.user || !SRV.profile) return;
  const fid = by === 'family' ? SRV.user.id : (fidIn || (profiles()[code] || {}).familyId);
  if (!fid || (by === 'family' && SRV.profile.button_code !== code)) return;
  const d = res.details || {}, model = res.ok ? Object.assign({}, res.model, { by }) : null;
  if (by === 'owner') await SRV.rpc('owner_save_calibration', { p_family: fid, p_ok: !!res.ok, p_kind: 'measured', p_model: model || d });
  else await sv(SRV.sb.from('calibrations').insert({ family_id: fid, button_code: code, by_role: by, by_id: SRV.user.id, ok: !!res.ok,
    toff: d.Toff ?? null, ton: d.Ton ?? null, tau_on: d.tauOn ?? null, tau_off: d.tauOff ?? null, model }));
  if (by !== 'family') SRV.detail[code] = null;
};
// a server day row -> the app's day object
function rowToDay(r) {
  const day = String(r.day).slice(0, 10), start = new Date(day + 'T00:00:00').getTime();
  return { key: day, start, ms: r.worn_min * 6e4, unsureMs: r.unsure_min * 6e4, dataMs: r.data_min * 6e4,
           segs: (r.segments || []).map(([a, b]) => [start + a * 6e4, start + b * 6e4]), fromServer: true };
}
// family: goal, goal note, clinicians, the newest calibration of the current button, and the hours
SRV.pullFamily = async (force) => {
  if (!SRV.on || !SRV.profile || SRV.profile.role !== 'family') return;
  if (!force && Date.now() - SRV.lastPull < 30000) return false;
  SRV.lastPull = Date.now();
  await SRV.loadMe();
  if (!SRV.profile) return false;
  const code = SRV.profile.button_code || null;
  let moved = false;
  if (session && session.role === 'family' && session.code !== code) {      // button changed by the clinic or SkoliData
    session = { role: 'family', code }; ssSet('sk.session', session); moved = true;
    if (B.connected && B.info && B.info.code !== code) { bleDisconnect(); B.info = null; B.live = null; }
  }
  SRV.clinicians = await SRV.rpc('my_care_team');
  await SRV.loadLabels();
  if (code && SRV.labels[code]) lsSet('sk.lastlabel', SRV.labels[code]);
  try { SRV.doctors = await SRV.rpc('clinician_directory'); } catch (e) { SRV.doctors = SRV.doctors || []; }
  if (!code) return true;
  const P = profiles(), p = P[code] || (P[code] = { createdAt: Date.now() });
  p.goal = SRV.profile.goal_h;
  const g = await sv(SRV.sb.from('goal_changes').select('*').eq('family_id', SRV.user.id).order('at', { ascending: false }).limit(20));
  p.goalHistory = g.slice().reverse().map(x => ({ from: x.from_h, to: x.to_h, by: x.by_role, at: Date.parse(x.at) }));
  p.goalNote = g[0] && g[0].by_role === 'clinician' ? { from: g[0].from_h, to: g[0].to_h, at: Date.parse(g[0].at) } : null;
  saveProfiles(P);
  const cal = await sv(SRV.sb.from('calibrations').select('*').eq('family_id', SRV.user.id).eq('button_code', code).eq('ok', true).order('created_at', { ascending: false }).limit(1));
  const local = getModel(code);
  if (cal[0] && cal[0].model && (!local || (cal[0].model.createdAt || 0) > (local.createdAt || 0))) {
    lsSet('sk.model.' + code, cal[0].model); lsSet('sk.days.' + code, {}); delete DAYCACHE[code];
  }
  // hours: this button's days fill gaps (e.g. a new phone); other buttons' days are added on top
  const rows = await sv(SRV.sb.from('day_summaries').select('*').eq('family_id', SRV.user.id).gte('day', dateKey(addDays(startOfDay(Date.now()), -20))));
  const dc = DAYCACHE[code] || (DAYCACHE[code] = {}), ex = {};
  rows.forEach(r => { const d = rowToDay(r);
    if (r.button_code === code) { if (!dc[d.key] || !(dc[d.key].dataMs > 0)) dc[d.key] = d; }
    else ex[d.key] = ex[d.key] ? mergeDay(ex[d.key], d) : d; });
  EXTRA[code] = ex;
  if (moved || !Object.keys(dc).some(k => !dc[k].fromServer)) computeDays(code).then(refresh);
  return true;
};

SRV.loadPatients = async () => {
  SRV.patients = await SRV.rpc('clinician_patients');
  await SRV.loadLabels();
  const ids = SRV.patients.map(x => x.family_id);
  const rows = ids.length ? await sv(SRV.sb.from('day_summaries').select('*').in('family_id', ids).gte('day', dateKey(addDays(startOfDay(Date.now()), -20)))) : [];
  const P = profiles();
  for (const pt of SRV.patients) {
    const code = pt._key = pt.button_code || ('YOK-' + pt.family_id.slice(0, 6).toUpperCase()), dc = DAYCACHE[code] = {};
    rows.filter(r => r.family_id === pt.family_id).forEach(r => { const d = rowToDay(r); dc[d.key] = dc[d.key] ? mergeDay(dc[d.key], d) : d; });
    P[code] = Object.assign(P[code] || {}, { goal: pt.goal_h, familyId: pt.family_id, displayName: pt.display_name, noButton: !pt.button_code, remote: true });
    const m = getMeta(code);
    if (pt.last_sync) m.lastSync = Math.max(m.lastSync || 0, Date.parse(pt.last_sync));
    if (pt.mv) m.mv = pt.mv; if (pt.fw) m.fw = pt.fw;
    setMeta(code, m);
  }
  saveProfiles(P);
};

  if (p.role === 'family' && !nameOk(p.display_name)) return go('famName');

}

      await SRV.loadPatients(); go('clinList'); toast(`${btnText(code)} serbest. Yeni aile bu butonla hesap oluşturabilir.`);
    } catch (e) { toast(trErr(e)); }
  };

  // ---------- owner ----------
  const famName = f => f.display_name || `İsimsiz (${f.city || 'şehir yok'})`;
  SCREENS.owner = () => {
    const o = SRV.owner, pending = o.clinicians.filter(c => !c.approved), approved = o.clinicians.filter(c => c.approved);
    const stale = h => !h.last_sync || Date.now() - Date.parse(h.last_sync) > 3 * 864e5;
    const healthRow = h => `<div class="li"><span><span class="k">${esc(btnText(h.code))}</span><br><span class="small">${h.assigned ? esc(h.family_name || 'ailede') : 'boşta'} · ${h.fw ? esc(h.fw) : '–'} · ${h.flash === false ? 'flash yok · ' : ''}${h.last_sync ? ago(Date.parse(h.last_sync)) : 'hiç senkron yok'}</span></span><span class="chip">${!h.assigned ? '⚪ boşta' : stale(h) ? '⚪ 3+ gün yok' : h.mv && h.mv < 2750 ? '🔵 pil az' : '🟢 çalışıyor'}</span></div>`;
    const famRow = f => `<button class="li" data-act="ownerOpenFam" data-arg="${esc(f.id)}"><span><span class="k">${esc(famName(f))}</span><br><span class="small">${esc(f.city || '')} · ${f.button_code ? esc(btnText(f.button_code)) : 'buton yok'}${f.clinicians ? ' · ' + f.clinicians + ' klinisyen' : ''}${f.button_code ? ' · ' + (f.last_sync ? ago(Date.parse(f.last_sync)) : 'senkron yok') : ''}</span></span><span class="v">›</span></button>`;
    return `<main>
    <header class="row"><div><div class="sub">SkoliData yönetici</div><h1>Yönetim</h1></div><button class="btn text" data-act="logout">Çıkış</button></header>
    <section class="card list"><div class="li"><span class="k">Onay bekleyen klinisyenler</span><span class="v">${pending.length}</span></div>
      ${pending.map(c => `<div class="li"><span><span class="k">${esc(c.name)}</span><br><span class="small">${c.kind === 'orthotist' ? 'ortotist' : 'doktor'} · ${esc(showLogin(c.email))} · ${esc(c.city || '')}</span></span><span style="display:flex;gap:4px"><button class="btn text" data-act="ownerApprove" data-arg="${c.id}">Onayla</button><button class="btn text" data-act="ownerReject" data-arg="${c.id}">Reddet</button></span></div>`).join('') || '<p class="small">Bekleyen yok.</p>'}
    </section>
    <section class="card"><b>Buton ekle / kontrol et</b><p class="small" style="margin:4px 0 8px">Yeni bir butonu sisteme ekle ya da elindeki butonun kimde olduğunu, yazılımını ve pilini gör. Butonun yanında ol.</p>
      <button class="btn primary" data-act="ownerScan">Butona bağlan</button>
      ${o.scan ? `<div class="list" style="margin-top:8px">
        <div class="li"><span class="k">Buton</span><span class="v">${esc(btnText(o.scan.code))}</span></div>
        <div class="li"><span class="k">Durum</span><span class="v">${o.scan.family ? 'Ailede: ' + esc(o.scan.family) : 'boşta – bir aile bu butonla hesap oluşturabilir'}</span></div>
        <div class="li"><span class="k">Yazılım</span><span class="v">${esc(o.scan.fw || '–')}</span></div>
        <div class="li"><span class="k">Pil</span><span class="v">${o.scan.mv ? (o.scan.mv / 1000).toFixed(2) + ' V' + (o.scan.mv < 2750 ? ' (az)' : '') : '–'}</span></div>
        <div class="li"><span class="k">Hafıza</span><span class="v">${o.scan.flash === 1 ? 'çalışıyor' : 'sorun var'}</span></div>
        <div class="li"><span class="k">Bluetooth adı</span><span class="v">${esc(o.scan.name || o.scan.code)}</span></div>
      </div>
      ${fwAtLeast(o.scan.fw, 0, 7) ? `<label class="f" style="margin-top:10px">Yeni Bluetooth adı<input class="in" id="bname" maxlength="20" placeholder="SkoliData 1" value="${esc(o.scan.name && o.scan.name !== o.scan.code ? o.scan.name : '')}"></label>
      <label class="f" style="margin-top:8px">Servis PIN'i<input class="in" id="spin" type="password" inputmode="numeric" autocomplete="off"></label>
      <div class="grid2" style="margin-top:10px"><button class="btn secondary" data-act="ownerSetName">Adı kaydet</button><button class="btn secondary" data-act="ownerDfu">Kablosuz güncelleme</button></div>
      <p class="help">Servis PIN'i buton yazılımında yazılı; uygulamada saklanmaz. 5 yanlış PIN'den sonra buton bu komutları yeniden başlatılana kadar kabul etmez.</p>` : `<p class="help" style="margin-top:8px">Ad verme ve kablosuz güncelleme için buton yazılımı en az fw0.7 olmalı.</p>`}` : ''}
    </section>
    <section class="card list"><div class="li"><span class="k">Aileler ve butonları</span><span class="v">${o.families.length}</span></div>
      ${o.families.map(famRow).join('') || '<p class="small">Henüz aile yok.</p>'}
      <p class="small">Bir aileye dokun: saatlerini gör, butonunu değiştir ya da ayır.</p>
    </section>
    <section class="card list"><div class="li"><span class="k">Klinisyenler</span><span class="v">${approved.length}</span></div>
      ${approved.map(c => `<div class="li"><span><span class="k">${esc(c.name)}</span><br><span class="small">${c.kind === 'orthotist' ? 'ortotist' : 'doktor'} · ${c.patients} aile · ${esc(showLogin(c.email))}</span></span><button class="btn text" data-act="ownerResetPw" data-arg="${c.id}">Şifre sıfırla</button></div>`).join('') || '<p class="small">Henüz yok.</p>'}
    </section>
    <section class="card list"><div class="li"><span class="k">Buton sağlığı</span><span class="v">${o.health.length}</span></div>${o.health.map(healthRow).join('') || '<p class="small">Henüz buton yok.</p>'}</section>
    <section class="card list"><div class="li"><span class="k">Şehirler</span><span class="v">aile · klinisyen</span></div>${o.cities.map(c => `<div class="li"><span class="k">${esc(c.city)}</span><span class="v">${c.families} · ${c.clinicians}</span></div>`).join('') || '<p class="small">Veri yok.</p>'}<p class="small">1–4 arası sayılar gizlilik için "1-4" gösterilir.</p></section>
    <section class="card list"><div class="li"><span class="k">Erişim günlüğü</span><span></span></div>${o.audit.slice(0, 15).map(a => `<div class="li"><span class="small">${new Date(a.at).toLocaleString('tr-TR')}</span><span class="v">${esc(a.action)}${a.detail && a.detail.code ? ' · ' + esc(a.detail.code) : ''}${a.detail && a.detail.by ? ' · ' + esc(a.detail.by) : ''}</span></div>`).join('') || '<p class="small">Boş.</p>'}</section>
    <button class="btn text" data-act="ownerRefresh" style="align-self:center">Yenile</button>
    <button class="btn text" data-act="pwOpen" data-arg="owner" style="align-self:center">Kendi şifremi değiştir</button>
  </main>`;
  };
  // one family: hours (logged) + button assignment
  SCREENS.ownerFam = p => {
    const f = SRV.owner.families.find(x => x.id === p.id);
    if (!f) return `<main>${backBtn('owner', 'Yönetim')}<p class="small">Aile bulunamadı.</p></main>`;
    const hours = p.hours ? (p.hours.length ? `<div class="list" style="margin-top:8px">${p.hours.map(r => `<div class="li"><span class="k">${esc(String(r.day).slice(0, 10))}</span><span class="v">${fmtH1(r.worn_min * 6e4)} sa / hedef ${r.goal_h}${r.unsure_min ? ' · emin değil ' + fmtH1(r.unsure_min * 6e4) : ''}</span></div>`).join('')}</div>` : '<p class="small">Veri yok.</p>') : '';
    const read = B.info && B.info.code && B.info.code !== f.button_code ? B.info.code : '';
    return `<main>${backBtn('owner', 'Yönetim')}
    <h1>${esc(famName(f))}</h1>
    <section class="card list">
      <div class="li"><span class="k">Şehir</span><span class="v">${esc(f.city || '–')}</span></div>
      <div class="li"><span class="k">Butonu</span><span class="v">${f.button_code ? esc(btnText(f.button_code)) : 'yok' + (f.last_button_code ? ' (son: ' + esc(btnText(f.last_button_code)) + ')' : '')}</span></div>
      <div class="li"><span class="k">Son senkron</span><span class="v">${f.button_code && f.last_sync ? ago(Date.parse(f.last_sync)) : '–'}</span></div>
      <div class="li"><span class="k">Hedef</span><span class="v">${f.goal_h || '–'} sa</span></div>
      <div class="li"><span class="k">Klinisyen</span><span class="v">${f.clinicians}</span></div>
      <div class="li"><span class="k">Kayıt</span><span class="v">${fmtDate(Date.parse(f.created_at))}</span></div>
    </section>
    ${f.button_code ? `${liveSection(f.button_code)}
    <div class="grid2"><button class="btn secondary" data-act="ownerRaw">Ham veri</button><button class="btn secondary" data-act="ownerCal">Kalibrasyon</button></div>` : ''}
    <section class="card"><b>Buton ataması</b><p class="small" style="margin:4px 0 8px">Bu aileye başka bir buton ver. Buton başka bir ailedeyse ondan alınır. Her değişiklik erişim günlüğüne yazılır.</p>
      <label class="f">Buton kodu<input class="in" id="ac" placeholder="SK-XXXXXXXX" autocapitalize="characters" value="${esc(read)}"></label>
      <div class="grid2" style="margin-top:10px"><button class="btn secondary" data-act="ownerReadButton">Butonu oku</button><button class="btn primary" data-act="ownerAssign">Bu butonu ver</button></div>
      ${f.button_code ? `<button class="btn text" data-act="ownerUnassign" style="margin-top:6px">Butonu bu aileden ayır</button>` : ''}
    </section>
    <section class="card"><b>Şifre</b><p class="small" style="margin:4px 0 8px">Aile şifresini unuttuysa önce telefonda kimliğini doğrula (buton kodu, şehir, kayıt ayı). Sonra geçici şifre oluştur; aile ilk girişte kendi şifresini belirler.</p>
      <button class="btn secondary" data-act="ownerResetPw" data-arg="${esc(f.id)}">Şifreyi sıfırla</button></section>
    <section class="card"><b>Saatler</b><p class="small" style="margin:4px 0 8px">Her görüntüleme erişim günlüğüne yazılır.</p>
      <button class="btn secondary" data-act="ownerHours">Saatleri göster</button>${hours}
      <button class="btn text" data-act="ownerRawCsv" style="margin-top:6px">Ham veri CSV (son 24 saat)</button></section>
  </main>`;
  };
  SCREENS.ownerPw = p => `<main>
    <h1>Geçici şifre</h1>
    <p class="sub">${esc(p.who)}</p>
    <section class="card center" style="display:flex;flex-direction:column;align-items:center;gap:6px">
      <b id="tmpPw" style="font-size:30px;letter-spacing:.08em;user-select:all">${esc(p.pw)}</b>
      <span class="small">${p.code ? 'Giriş: butona (' + esc(btnName(p.code) || 'SkoliData butonu') + ') bağlan + bu şifre' : p.email ? 'Giriş: ' + esc(showLogin(p.email)) + ' + bu şifre' : ''}</span></section>
    <div class="note"><b>Bir kez gösterilir</b>Bu şifreyi kişiye telefonda ya da yüz yüze söyle. İlk girişte kendi yeni şifresini belirlemesi istenecek. Şifre hiçbir yere kaydedilmez.</div>
    <div style="flex:1"></div>
    <button class="btn secondary" data-act="ownerPwCopy">Kopyala</button>
    <button class="btn primary" data-act="ownerPwDone">Tamam</button>
  </main>`;
  ACTIONS.ownerResetPw = async id => {
    const f = SRV.owner.families.find(x => x.id === id), c = SRV.owner.clinicians.find(x => x.id === id);
    const who = f ? `${famName(f)}${f.button_code ? ' · ' + f.button_code : ''}` : c ? `${c.name} · ${showLogin(c.email)}` : '';
    if (!confirm(`Şifre sıfırlansın mı?\n\n${who}\n\nKimliğini doğruladın mı? Eski şifre hemen çalışmaz olur; sana yeni bir geçici şifre göstereceğim.`)) return;
    const pw = tempPassword(), back = { screen, params: Object.assign({}, params) };
    try {
      await SRV.rpc('owner_reset_password', { p_user: id, p_password: pw });
      SRV.loadOwner().catch(() => {});
      go('ownerPw', { pw, who, code: f && (f.button_code || f.last_button_code), email: c && c.email, back });
    } catch (e) { toast(trErr(e)); }
  };
  ACTIONS.ownerPwCopy = () => { try { navigator.clipboard.writeText(params.pw).then(() => toast('Kopyalandı.'), () => toast('Kopyalanamadı; şifreyi elle yaz.')); } catch (e) { toast('Kopyalanamadı; şifreyi elle yaz.'); } };
  ACTIONS.ownerPwDone = () => { const b = params.back || { screen: 'owner', params: {} }; go(b.screen, b.params); };
  ACTIONS.ownerRefresh = async () => { try { await SRV.loadOwner(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.ownerApprove = async id => { try { const code = await SRV.rpc('owner_approve_clinician', { p_id: id, p_ok: true }); toast('Onaylandı: ' + code); await SRV.loadOwner(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.ownerReject = async id => { if (!confirm('Bu klinisyen onaylanmayacak. Emin misin?')) return; try { await SRV.rpc('owner_approve_clinician', { p_id: id, p_ok: false }); await SRV.loadOwner(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.ownerOpenFam = id => go('ownerFam', { id });
  const ownerTo = s => { const f = SRV.owner.families.find(x => x.id === params.id); if (!f || !f.button_code) return;
    go(s, { code: f.button_code, fid: f.id, name: famName(f), backTo: { screen: 'ownerFam', params: { id: f.id } }, backLabel: famName(f) }); };
  ACTIONS.ownerRaw = () => ownerTo('raw');
  ACTIONS.ownerCal = () => ownerTo('calPage');
  ACTIONS.ownerScan = async () => {
    const ok = await bleConnect({ infoOnly: true });
    if (!ok || !B.info) return;
    const i = B.info;
    try {
      const family = await SRV.rpc('owner_register_button', { p_code: i.code, p_fw: i.fw || null, p_mv: i.mv || null });
      await SRV.loadLabels();
      await nameButtonIfNew();                         // a brand-new button is named "SkoliData <next number>" right away
      SRV.owner.scan = { code: i.code, fw: i.fw, mv: i.mv, flash: i.flash, family, name: i.name };
      bleDisconnect(); B.info = null; B.live = null;
      await SRV.loadOwner();
      render(); toast(family ? `${btnText(i.code)} şu ailede: ${family}` : `${btnText(i.code)} eklendi (boşta).`);
    } catch (e) { bleDisconnect(); B.info = null; toast(trErr(e)); }
  };
  // service commands (need the PIN; the button answers "N ok" / "U ok" / "... bad" / "... locked")
  async function ownerService(cmd) {
    const sc = SRV.owner.scan; if (!sc) return null;
    const ok = await bleConnect({ expect: sc.code, infoOnly: true }); if (!ok) return null;
    B.svc = null; await send(cmd); await waitFor(() => B.svc, 5000);
    const r = B.svc; return r;
  }
  const svcErr = r => !r ? 'Buton yanıt vermedi.' : /locked/.test(r) ? 'Çok fazla yanlış PIN. Butonu yeniden başlat (pili çıkarıp tak), sonra tekrar dene.' : 'PIN ya da ad hatalı.';
  ACTIONS.ownerSetName = async () => {
    const nm = $('#bname').value.trim(), pin = $('#spin').value.trim(), sc = SRV.owner.scan;
    if (!nm || new TextEncoder().encode(nm).length > 20) { toast('Ad 1–20 karakter olmalı.'); return; }
    if (!/^\d{4,8}$/.test(pin)) { toast("Servis PIN'ini yaz."); return; }
    const r = await ownerService('n' + pin + ':' + nm);
    bleDisconnect(); B.info = null; B.live = null;
    if (r === 'N ok') { sc.name = nm; const m = getMeta(sc.code); m.bleName = nm; setMeta(sc.code, m); render(); toast(`Ad kaydedildi: ${nm}. Telefonlar bir sonraki taramada bu adı görür.`); }
    else toast(svcErr(r));
  };
  ACTIONS.ownerDfu = async () => {
    const pin = $('#spin').value.trim(), sc = SRV.owner.scan;
    if (!/^\d{4,8}$/.test(pin)) { toast("Servis PIN'ini yaz."); return; }
    if (!confirm(`${sc.name || sc.code} kablosuz güncelleme moduna alınsın mı?\n\nButon ölçüm kaydetmeyi bırakır ve yeni yazılımı bekler. Hafızadaki ölçümler silinmez.\n\nGüncellemeyi hemen yap: telefondaki DFU güncelleme uygulamasıyla (yazılım paketindeki README'de yazıyor) "DFU" geçen cihaza bağlan ve .zip güncelleme dosyasını seç. Güncelleme yapmazsan pili çıkarıp takınca buton eski yazılımla normal çalışmaya döner.`)) return;
    const r = await ownerService('u' + pin);
    B.connected = false; B.info = null; B.live = null;
    if (r === 'U ok') alert('Buton güncelleme modunda.\n\n1) Telefondaki DFU güncelleme uygulamasını aç (yazılım paketindeki README dosyasında yazıyor).\n2) Listede "DFU" geçen cihaza bağlan.\n3) DFU / Update deyip SkoliData_v0.7_wireless_update.zip (ya da yeni) dosyasını seç.\n4) Bitince buton kendiliğinden yeniden başlar; buraya dönüp "Butona bağlan" ile yazılım sürümünü kontrol et.\n\nVazgeçersen: pili çıkarıp tak.');
    else { bleDisconnect(); toast(svcErr(r)); }
  };
  ACTIONS.ownerReadButton = async () => { const ok = await bleConnect({ infoOnly: true }); if (ok && B.info) { render(); toast('Buton: ' + B.info.code); } };
  ACTIONS.ownerHours = async () => {
    try { const rows = await SRV.rpc('owner_family_overview', { p_family: params.id }); go('ownerFam', { id: params.id, hours: rows }); SRV.loadOwner().catch(() => {}); }
    catch (e) { toast(trErr(e)); }
  };
  ACTIONS.ownerRawCsv = async () => {
    const f = SRV.owner.families.find(x => x.id === params.id), t1 = Date.now() + 60e3, t0 = Date.now() - 864e5;
    try {
      const rows = await SRV.rpc('owner_raw_days', { p_family: f.id, p_from: dateKey(t0), p_to: dateKey(t1) });
      let recs = []; for (const row of rows) recs = recs.concat(await decodeRawRow(row, row.button_code));
      recs = recs.filter(r => r.t >= t0 && r.t <= t1).sort((a, b) => a.t - b.t);
      if (!recs.length) { toast('Sunucuda son 24 saatin ölçümü yok.'); return; }
      const name = (f.button_code || f.last_button_code || 'aile'), t00 = recs[0].t;
      download(`skolidata_${name}_24h.csv`, 'time_s,skin_C,humidity_pct,chip_C,wall_time\n' + recs.map(r => `${((r.t - t00) / 1000).toFixed(0)},${r.skin ?? ''},${r.rh ?? ''},${r.chip},${new Date(r.t).toISOString()}`).join('\n'));
      SRV.loadOwner().catch(() => {});
    } catch (e) { toast(trErr(e)); }
  };
  ACTIONS.ownerAssign = async () => {
    const code = $('#ac').value.trim().toUpperCase(), f = SRV.owner.families.find(x => x.id === params.id);
    if (!/^SK-[2-9A-HJ-NP-Z]{8}$/.test(code)) { toast('Buton kodu SK-XXXXXXXX biçiminde olmalı.'); return; }
    if (code === f.button_code) { toast('Bu buton zaten bu ailede.'); return; }
    const other = SRV.owner.families.find(x => x.button_code === code);
    const msg = other ? `${code} şu an başka bir ailede: ${famName(other)}.\n\nOndan alınıp bu aileye verilecek: ${famName(f)}\n\nÖnceki aile yeni buton bağlayana kadar saat kaydedemez. Emin misin?`
                      : `${code} bu aileye verilsin mi: ${famName(f)}?${f.button_code ? ` Şu anki butonu (${f.button_code}) boşa çıkar.` : ''}`;
    if (!confirm(msg)) return;
    try { await SRV.rpc('owner_assign_button', { p_family: f.id, p_code: code }); await SRV.loadOwner(); go('ownerFam', { id: f.id }); toast(`${code} → ${famName(f)}`); }
    catch (e) { toast(trErr(e)); }
  };
  ACTIONS.ownerUnassign = async () => {
    const f = SRV.owner.families.find(x => x.id === params.id);
    if (!confirm(`${f.button_code} bu aileden ayrılsın mı: ${famName(f)}?\n\nAilenin saatleri hesabında kalır. Aile yeni buton bağlayana kadar saat kaydedemez.`)) return;
    try { await SRV.rpc('owner_assign_button', { p_family: f.id, p_code: '' }); await SRV.loadOwner(); go('ownerFam', { id: f.id }); toast('Buton boşa çıktı.'); }
    catch (e) { toast(trErr(e)); }
  };
  LIVE.add('famConnect');
}

// ================= start =================
(async () => {
  if (SRV.on) {
    try { await SRV.loadMe(); } catch (e) {}
    if (SRV.profile) { try { return await routeAfterLogin(); } catch (e) { toast(trErr(e)); } }
    render();
    return;
  }
  if (session && session.role === 'family' && profiles()[session.code]) screen = 'famHome';
  else if (session && session.role === 'clinician') screen = 'clinList';
  render();
})();
// keep-alive for firmware v0.5: the button closes a connection after 20 min without any message (so a forgotten
// phone can't drain the coin cell). While the app is open on screen and connected, say "k" every 4 min.
setInterval(() => { if (B.connected && !B.syncing && document.visibilityState === 'visible') send('k'); }, 240000);
setInterval(() => { if (screen === 'famHome' || screen === 'clinPatient') { const c = screen === 'famHome' ? session && session.code : params.code; if (c && B.connected) computeDays(c, 2).then(() => { refresh(); }); } }, 60000);
</script>
</body>
</html>
