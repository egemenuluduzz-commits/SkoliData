<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5EFF">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>SkoliData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--blue:#1E5EFF;--deep:#1748D6;--light:#5AA2FF;--pale:#E8F1FF;--navy:#0B1F44;--slate:#5B6987;--ground:#F3F6FC;--line:#DCE4F2;--soft:#A9C8FF;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--navy);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:800}
p{margin:0;line-height:1.45}
.sub{font-size:15px;font-weight:600;color:var(--slate)}
.card{background:var(--white);border:1px solid #E4EBF7;border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(11,31,68,.04),0 8px 24px rgba(11,31,68,.05)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;border:none;font:700 17px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;padding:0 16px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.primary{background:var(--blue);color:#fff}
.secondary{background:#fff;color:var(--deep);border:1.5px solid #C9D8F8}
.text{background:none;color:var(--deep);min-height:44px;width:auto;padding:0 6px}
.korsem{min-height:76px;border-radius:24px;background:linear-gradient(135deg,#3D7DFF 0%,#1E5EFF 55%,#1646D0 100%);color:#fff;font-size:24px;font-weight:800;box-shadow:0 14px 30px rgba(30,94,255,.3)}
.klinisyen{min-height:76px;border-radius:24px;background:#fff;color:var(--navy);border:2px solid var(--blue);font-size:22px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{background:none;border:none;color:var(--deep);font:700 17px 'Plus Jakarta Sans',system-ui;display:flex;align-items:center;gap:4px;min-height:44px;padding:0;cursor:pointer}
.pill{align-self:center;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 18px;border-radius:22px;background:#fff;border:1px solid #E4EBF7;font-weight:700;font-size:16px;text-align:center}
.dot{width:10px;height:10px;border-radius:5px;background:var(--blue);box-shadow:0 0 0 4px rgba(30,94,255,.18);flex:none}
.dot.off{background:none;border:2px solid var(--slate);box-shadow:none}
.dot.wait{background:var(--soft);box-shadow:none}
.ringwrap{position:relative;width:220px;height:220px;align-self:center}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big{font-weight:800;letter-spacing:-.03em;display:flex;align-items:baseline;gap:3px}
.big b{font-size:40px;line-height:1}.big i{font-style:normal;font-size:18px;margin-right:5px}
.goal{font-size:15px;font-weight:700;color:var(--slate)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--slate)}
.wd span:first-child{width:32px;height:32px;border-radius:16px;border:2px dashed var(--line)}
.wd.done span:first-child{background:var(--blue);border:none}
.wd.miss span:first-child{border:2.5px solid var(--soft)}
.wd.today span:first-child{border:2.5px solid var(--blue);display:flex;align-items:center;justify-content:center}
.wd.today.done span:first-child{border:none}
.wd.today span:first-child::after{content:'';width:10px;height:10px;border-radius:5px;background:var(--blue)}
.wd.today.done span:first-child::after{background:#fff}
.wd.today{color:var(--navy);font-weight:800}
.upd{text-align:center;font-size:14px;font-weight:600;color:var(--slate)}
.note{background:var(--pale);border:1px solid #D3E2FD;border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.45;color:#34446A}
.note b{display:block;color:var(--navy);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat span{display:block;font-size:13px;font-weight:700;color:var(--slate)}.stat b{font-size:22px;font-weight:800}
.small{font-size:13px;color:var(--slate);line-height:1.45}
.center{text-align:center}
.mark{width:84px;height:84px;border-radius:42px;background:linear-gradient(135deg,var(--light),var(--blue));display:flex;align-items:center;justify-content:center;align-self:center;box-shadow:0 12px 30px rgba(30,94,255,.28)}
.mark span{width:32px;height:32px;border-radius:16px;border:5px solid #fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--slate)}
input.in{height:54px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:600 17px 'Plus Jakarta Sans',system-ui;color:var(--navy);background:#fff;width:100%}
input.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,94,255,.12)}
.err{color:var(--deep);font-weight:700;font-size:14px;min-height:20px}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:48px;height:48px;border-radius:24px;border:none;background:var(--pale);color:var(--deep);font:800 24px system-ui;cursor:pointer}
.stepper b{font-size:26px;font-weight:800}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid #EEF2F9;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.li:last-child{border-bottom:none}
.li .k{font-weight:700}.li .v{color:var(--slate);font-weight:600;font-size:15px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pale);color:var(--deep);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.4;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--blue);flex:none;margin:0}
.gauge{display:flex;gap:4px}.gauge i{flex:1;height:10px;border-radius:5px;background:var(--line)}.gauge i.on{background:var(--blue)}
pre.log{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.4;margin:8px 0 0;max-height:200px;overflow:auto;background:var(--ground);border-radius:12px;padding:10px}
svg.chart{width:100%;height:auto;display:block}
.timer{font-size:56px;font-weight:800;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:8px;justify-content:center}.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:90vw;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="skolidata-algo.js"></script>
<script>
'use strict';
const APP_VERSION = 'app v1.0 · algo v1';
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e', NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
// Clinician accounts: only a salted SHA-256 of the password is stored here (never the password itself).
// NOTE: this is a front door for testing, not real security; real accounts need the server (master plan §6-7).
const CLINICIANS = [{ u: 'klinisyen', salt: '060785deb17a84e5a7b5431cf4c844bb', hash: '757024313534ac340061ad41847cc77f2e50bee7e553b2dfcf3d519eb9f2002d', name: 'Klinisyen' }];
const DEFAULT_MODEL = { version: 1, createdAt: 0, isDefault: true, Toff: 24, Ton: 33.5, gap: 9.5, thrOn: 29.7, thrOff: 27.8, tauOn: 100, tauOff: 150, lagOn: 92, lagOff: 137 };
const DAYS_TR = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
const MONTHS_TR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const WEEKDAYS_TR = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

// ================= small helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mem = {};
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); } catch (e) { return k in mem ? mem[k] : d; } }
function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
function ssGet(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return mem['ss' + k] || null; } }
function ssSet(k, v) { mem['ss' + k] = v; try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(pred, ms) { const end = Date.now() + ms; while (Date.now() < end) { if (pred()) return true; await sleep(50); } return !!pred(); }
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const dateKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtHM = ms => { const h = Math.floor(ms / 3.6e6), m = Math.floor((ms % 3.6e6) / 6e4); return `${h} sa ${m} dk`; };
const fmtH1 = ms => (ms / 3.6e6).toFixed(1).replace('.', ',');
const fmtDate = t => { const d = new Date(t); return `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`; };
function ago(t) { if (!t) return 'henüz yok'; const s = (Date.now() - t) / 1000; if (s < 60) return 'az önce'; if (s < 3600) return Math.floor(s / 60) + ' dk önce'; if (s < 86400) return Math.floor(s / 3600) + ' sa önce'; return Math.floor(s / 86400) + ' gün önce'; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => x.toString(16).padStart(2, '0')).join('');

// ================= storage =================
// small things in localStorage; readings in IndexedDB (falls back to memory)
const profiles = () => lsGet('sk.profiles', {});
const saveProfiles = p => lsSet('sk.profiles', p);
const getMeta = code => lsGet('sk.meta.' + code, { next: 0, lastSync: 0, mv: 0, firstSeen: Date.now() });
const setMeta = (code, m) => lsSet('sk.meta.' + code, m);
const getModel = code => lsGet('sk.model.' + code, null);
const modelFor = code => getModel(code) || DEFAULT_MODEL;

let DB = null, memRecs = null;
function idb() {
  return new Promise((res) => {
    if (DB || memRecs) return res(DB);
    try {
      const r = indexedDB.open('skolidata', 1);
      r.onupgradeneeded = () => { const st = r.result.createObjectStore('recs', { keyPath: ['code', 'idx'] }); st.createIndex('byTime', ['code', 't']); };
      r.onsuccess = () => { DB = r.result; res(DB); };
      r.onerror = () => { memRecs = []; res(null); };
    } catch (e) { memRecs = []; res(null); }
  });
}
async function putRecs(list) {
  if (!list.length) return;
  const db = await idb();
  if (!db) { memRecs.push(...list); return; }
  await new Promise((res) => { const tx = db.transaction('recs', 'readwrite'), st = tx.objectStore('recs'); list.forEach(r => st.put(r)); tx.oncomplete = res; tx.onerror = res; });
  // readings arrived for these days -> their cached hours must be recomputed
  const byCode = {};
  list.forEach(r => { byCode[r.code] = Math.min(byCode[r.code] ?? Infinity, r.t); });
  for (const c in byCode) { const k = dateKey(byCode[c]), cache = lsGet('sk.days.' + c, {}); for (const d in cache) if (d >= k) delete cache[d]; lsSet('sk.days.' + c, cache); }
}
async function getRecs(code, t0, t1) {
  const db = await idb();
  if (!db) return memRecs.filter(r => r.code === code && r.t >= t0 && r.t <= t1).sort((a, b) => a.t - b.t);
  return new Promise((res) => { const q = db.transaction('recs').objectStore('recs').index('byTime').getAll(IDBKeyRange.bound([code, t0], [code, t1])); q.onsuccess = () => res(q.result); q.onerror = () => res([]); });
}
async function deleteCode(code) {
  const db = await idb();
  if (!db) { memRecs = memRecs.filter(r => r.code !== code); return; }
  await new Promise((res) => { const tx = db.transaction('recs', 'readwrite'); tx.objectStore('recs').delete(IDBKeyRange.bound([code, 0], [code, Number.MAX_SAFE_INTEGER])); tx.oncomplete = res; tx.onerror = res; });
}

// ================= Bluetooth (protocol 2) =================
const B = { device: null, rx: null, connected: false, info: null, chunk: null, syncing: false, live: null, log: [], writeQ: Promise.resolve(), rxBuf: new Uint8Array(0), binLeft: 0 };
function blog(t) { B.log.push(new Date().toLocaleTimeString('tr-TR') + '  ' + t); if (B.log.length > 40) B.log.shift(); }
function send(cmd) {
  blog('→ ' + cmd);
  B.writeQ = B.writeQ.then(() => B.rx ? B.rx.writeValue(new TextEncoder().encode(cmd + '\n')) : null).catch(e => blog('write error ' + e.message));
  return B.writeQ;
}
async function bleConnect() {
  if (!navigator.bluetooth) { alert("Bu tarayıcı Bluetooth'a bağlanamıyor. iPhone'da ücretsiz \"Bluefy\" uygulamasıyla, Android'de Chrome ile aç."); return false; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'SK-' }, { services: [NUS] }], optionalServices: [NUS] });
    B.device = dev; B.live = null;
    dev.addEventListener('gattserverdisconnected', () => {
      if (dev !== B.device) return;            // an older button we already left
      B.connected = false; B.syncing = false; blog('bağlantı koptu');
      if (CAL.phase === 'off' || CAL.phase === 'on') calFail('Bağlantı koptu. Telefonu butona yakın tut ve tekrar dene.');
      refresh();
    });
    const server = await B.device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    const tx = await svc.getCharacteristic(NUS_TX);
    B.rx = await svc.getCharacteristic(NUS_RX);
    tx.addEventListener('characteristicvaluechanged', ev => { const v = ev.target.value; onBytes(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength))); });
    await tx.startNotifications();
    B.connected = true; B.rxBuf = new Uint8Array(0); B.binLeft = 0;
    blog('bağlandı: ' + (B.device.name || ''));
    refresh();
    return await syncAll();
  } catch (e) {
    if (e && e.name !== 'NotFoundError') alert('Bağlanamadı: ' + e.message);
    B.connected = !!(B.device && B.device.gatt && B.device.gatt.connected);
    refresh();
    return false;
  }
}
function onBytes(u8) {
  const nb = new Uint8Array(B.rxBuf.length + u8.length); nb.set(B.rxBuf); nb.set(u8, B.rxBuf.length); B.rxBuf = nb;
  for (;;) {
    if (B.binLeft > 0) {
      const n = Math.min(B.binLeft, B.rxBuf.length - (B.rxBuf.length % 8));
      if (n < 8) break;
      const dv = new DataView(B.rxBuf.buffer, B.rxBuf.byteOffset, n);
      for (let o = 0; o < n; o += 8) decodeRec(dv, o);
      B.rxBuf = B.rxBuf.slice(n); B.binLeft -= n;
      continue;
    }
    const i = B.rxBuf.indexOf(10);
    if (i < 0) break;
    const line = new TextDecoder().decode(B.rxBuf.slice(0, i)).trim();
    B.rxBuf = B.rxBuf.slice(i + 1);
    if (line) handleLine(line);
  }
}
function wallTime(secs) { return B.info.at - (B.info.up - secs) * 1000; }
function decodeRec(dv, o) {
  const c = B.chunk; const idx = c.from + c.got++;
  const t = dv.getUint32(o, true), skin = dv.getInt16(o + 4, true), rh2 = dv.getUint8(o + 6), chip2 = dv.getUint8(o + 7);
  if (t === 0xFFFFFFFF) return;
  if (t === 0xFFFFFFFE || t === 0xFFFFFFFD) { c.mv = skin & 0xFFFF; return; }   // boot / battery records
  if (idx < B.info.boot) { c.untimed++; return; }                              // from an earlier power-on we never synced
  c.recs.push({ code: B.info.code, idx, t: wallTime(t), skin: skin === -32768 ? null : skin / 100, rh: rh2 === 255 ? null : rh2 / 2, chip: chip2 / 2 - 20 });
}
function handleLine(line) {
  blog('← ' + (line.length > 90 ? line.slice(0, 90) + '…' : line));
  if (line.startsWith('SkoliData')) {
    const g = k => { const m = new RegExp('\\b' + k + '=(\\d+)').exec(line); return m ? +m[1] : null; };
    const code = (/SK-[0-9A-Z]{8}/.exec(line) || [''])[0], fw = (/fw[0-9.]+/.exec(line) || [''])[0];
    if (!/ p2 /.test(line + ' ')) { B.info = { code, fw, old: true, at: Date.now() }; return; }
    B.info = { code, fw, up: g('up'), every: g('every'), boot: g('boot'), first: g('first'), next: g('next'), mv: g('mv'), flash: g('flash'), at: Date.now() };
    return;
  }
  if (line.startsWith('D ')) { const p = line.split(' '); B.chunk = { from: +p[1], count: +p[2], got: 0, recs: [], untimed: 0, done: false }; B.binLeft = +p[2] * 8; return; }
  if (line === 'E') { if (B.chunk) finishChunk(); return; }
  if (line.startsWith('L,') && B.info && !B.info.old) {
    const p = line.split(',');
    const r = { code: B.info.code, idx: +p[1], t: wallTime(+p[2]), skin: p[3] === 'ERR' ? null : +p[3], rh: p[4] === 'ERR' ? null : +p[4], chip: +p[5] };
    B.live = r;
    putRecs([r]);
    const m = getMeta(r.code); if (m.next === r.idx) { m.next = r.idx + 1; setMeta(r.code, m); }
    if (CAL.phase === 'off' || CAL.phase === 'on') CAL.buf[CAL.phase].push(r);
    refresh();
  }
}
async function finishChunk() { const c = B.chunk; await putRecs(c.recs); c.done = true; }
async function syncAll() {
  B.info = null; B.syncing = true; refresh();
  for (let k = 0; k < 6 && !B.info; k++) { await send('i'); await waitFor(() => B.info, 1500); }
  if (!B.info) { B.syncing = false; toast('Buton yanıt vermedi.'); refresh(); return false; }
  if (B.info.old) { B.syncing = false; alert('Bu butonda eski yazılım var (' + B.info.fw + '). SkoliData_4_Button yazılımını yükle.'); refresh(); return false; }
  const code = B.info.code, meta = getMeta(code);
  let from = Math.max(meta.next || 0, B.info.first);
  for (let guard = 0; guard < 200; guard++) {
    B.chunk = null;
    await send('d' + from);
    const ok = await waitFor(() => B.chunk && B.chunk.done, 30000);
    if (!ok) { blog('aktarım yarım kaldı'); break; }
    if (B.chunk.mv) meta.mv = B.chunk.mv;
    from = B.chunk.from + B.chunk.count; meta.next = from; setMeta(code, meta);
    refresh();
    if (B.chunk.count < 4000) break;
  }
  meta.lastSync = Date.now(); meta.mv = B.info.mv || meta.mv; meta.fw = B.info.fw; setMeta(code, meta);
  B.syncing = false;
  await computeDays(code, 14, true);
  refresh();
  return true;
}

// ================= wear hours per day (cached for finished days) =================
const DAYCACHE = {};   // code -> {key -> day}
async function computeDays(code, nDays = 14, force) {
  const model = modelFor(code), meta = getMeta(code);
  const cache = lsGet('sk.days.' + code, {});
  const today0 = startOfDay(Date.now()), out = {};
  for (let d = nDays - 1; d >= 0; d--) {
    const a = addDays(today0, -d), b = addDays(today0, -d + 1), key = dateKey(a), isToday = d === 0;
    const c = cache[key];
    if (!isToday && c && c.modelAt === model.createdAt) { out[key] = c; continue; }
    const recs = await getRecs(code, a - 30 * 60e3, Math.min(b, Date.now() + 60e3));
    const day = { key, start: a, ms: 0, unsureMs: 0, dataMs: 0, segs: [], n: 0, modelAt: model.createdAt };
    if (recs.length > 1) {
      const r = SkoliAlgo.classify(recs, model), st = r.states;

function battery(code) {
  const m = getMeta(code), mv = m.mv || 0;
  if (!mv) return { txt: 'Henüz bilinmiyor', seg: 0 };
  if (mv >= 3150) return { txt: 'USB ile çalışıyor', seg: 5 };
  const monthsUsed = (Date.now() - (m.firstSeen || Date.now())) / (30.4 * 864e5);
  if (mv < 2600) return { txt: 'Pil bitmek üzere. SkoliData ile iletişime geç.', seg: 1, low: true };

  return { txt: `Yaklaşık ${left} ay kaldı`, seg: Math.max(3, Math.min(5, Math.ceil(left / 2.4))) };
}

    const yy = i * rowH;
    s += `<text x="0" y="${yy + 13}" font-size="11" font-weight="700" fill="#5B6987">${DAYS_TR[new Date(d.start).getDay()]}</text><rect x="${x0}" y="${yy + 3}" width="${w}" height="${rowH - 6}" rx="4" fill="#E8F1FF"/>`;
    d.segs.forEach(([a, b]) => { const xa = x0 + w * (a - d.start) / 864e5, xb = x0 + w * (b - d.start) / 864e5; s += `<rect x="${xa.toFixed(1)}" y="${yy + 3}" width="${Math.max(1, xb - xa).toFixed(1)}" height="${rowH - 6}" rx="3" fill="#1E5EFF"/>`; });
  });
  return s + '</svg>';
}
SCREENS.famWeek = () => {
  const code = session.code, p = profiles()[code] || {}, goalMs = (p.goal || 16) * 3.6e6, days = daysList(code, 7);
  const withData = days.filter(d => d.dataMs > 0), avg = withData.length ? withData.reduce((s, d) => s + d.ms, 0) / withData.length : 0;
  return `<main>${backBtn('famHome')}
  <h1>Haftam</h1>
  <section class="card">${barsSvg(days, goalMs)}</section>
  <div class="grid2"><div class="card stat"><span>Ortalama</span><b>${fmtH1(avg)} sa</b></div><div class="card stat"><span>Hedefte</span><b>${days.filter(d => d.ms >= goalMs).length} / 7 gün</b></div></div>
  <section class="card"><b>Ne zaman takıldı?</b><p class="small" style="margin:4px 0 8px">Mavi alanlar korsenin takılı olduğu saatler.</p>${weekMapSvg(days)}</section>
</main>`;
};
SCREENS.famSettings = () => {
  const code = session.code, p = profiles()[code] || {}, bat = battery(code), model = getModel(code);
  return `<main>${backBtn('famHome')}
  <h1>Ayarlar</h1>
  <section class="card list">
    <div class="li"><span class="k">Günlük hedef</span><span class="v">${p.goal || 16} saat</span></div>
    <div class="stepper" style="padding:6px 0 10px"><button data-act="famGoalAdj" data-arg="-1" aria-label="Azalt">–</button><span class="small">Hedefi değiştir</span><button data-act="famGoalAdj" data-arg="1" aria-label="Artır">+</button></div>
    <div class="li"><span class="k">Butonum</span><span class="v">${esc(code)}</span></div>
    <div class="li" style="flex-direction:column;align-items:stretch"><div class="row"><span class="k">Pil</span><span class="v">${esc(bat.txt)}</span></div><div class="gauge" aria-hidden="true">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= bat.seg ? 'on' : ''}"></i>`).join('')}</div></div>
    <div class="li"><span class="k">Kalibrasyon</span><span class="v">${model ? fmtDate(model.createdAt) : 'yapılmadı'}</span></div>
  </section>
  <section class="card list">
    <button class="li" data-act="showConsent"><span class="k">Gizlilik ve onay</span><span class="v">›</span></button>
    <div class="li"><span class="k">İletişim</span><span class="v">SkoliData ekibi</span></div>
    <div class="li"><span class="k">Sürüm</span><span class="v">${APP_VERSION}</span></div>
  </section>
  <button class="btn secondary" data-act="logout">Çıkış yap</button>
  <button class="btn text" data-act="famDelete" style="align-self:center">Hesabı ve verileri sil</button>
</main>`;
};
SCREENS.consentView = () => `<main>${backBtn(session && session.role === 'family' ? 'famSettings' : 'login')}<h1>Gizlilik ve onay</h1><section class="card" style="display:flex;flex-direction:column;gap:10px;font-size:15px">${CONSENT_TEXT}</section></main>`;

// ---------- clinician ----------
SCREENS.clinLogin = () => `<main>${backBtn('login')}
  <h1>Klinisyen girişi</h1>
  <label class="f">Kullanıcı adı<input class="in" id="cu" autocapitalize="none" autocomplete="username"></label>
  <label class="f">Şifre<input class="in" id="cp" type="password" autocomplete="current-password"></label>
  <p class="err" id="err"></p>
  <button class="btn primary" data-act="clinLoginBtn">Giriş yap</button>
  <button class="btn text" data-act="forgot" style="align-self:center">Şifremi unuttum</button>
  <div style="flex:1"></div>
  <p class="small center">Klinisyen hesapları SkoliData tarafından onaylanır.</p>
</main>`;
function knownCodes() {
  const set = new Set(Object.keys(profiles()));
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('sk.meta.')) set.add(k.slice(8)); } } catch (e) { Object.keys(mem).filter(k => k.startsWith('sk.meta.')).forEach(k => set.add(k.slice(8))); }
  return [...set].sort();
}
function miniBars(code, goalMs) {
  const days = daysList(code, 8).slice(0, 7), max = Math.max(goalMs, ...days.map(d => d.ms), 1);
  return `<svg width="70" height="26" viewBox="0 0 70 26" aria-hidden="true">${days.map((d, i) => { const h = Math.max(1.5, 24 * d.ms / max); return `<rect x="${i * 10}" y="${26 - h}" width="7" height="${h}" rx="2" fill="${d.ms >= goalMs ? '#1E5EFF' : '#A9C8FF'}"/>`; }).join('')}</svg>`;
}
SCREENS.clinList = () => {
  const codes = knownCodes(), P = profiles();
  const rows = codes.map(c => { const s = summary(c), g = (P[c] && P[c].goal) || 16; return `<button class="li" data-act="openPatient" data-arg="${esc(c)}"><span><span class="k">${esc(c)}</span><br><span class="small">${s.daysWithData ? fmtH1(s.avg) + ' sa ort.' : 'veri yok'} · hedef ${g} sa</span> ${s.uneven ? '<span class="chip">Düzensiz</span>' : ''}</span>${miniBars(c, g * 3.6e6)}</button>`; }).join('');
  return `<main>
  <header class="row"><div><div class="sub">${esc((CLINICIANS.find(x => x.u === session.u) || {}).name || '')} <span class="chip">Doğrulanmış</span></div><h1>Hastalarım</h1></div><button class="btn text" data-act="logout">Çıkış</button></header>
  <section class="card list">${rows || '<p class="small">Bu telefonda henüz kayıtlı buton yok. Klinikte butonu bağlayarak başla.</p>'}</section>
  ${B.syncing ? '<div class="pill"><span class="dot wait"></span>Buton okunuyor…</div>' : ''}
  <button class="btn secondary" data-act="clinConnect">Buton bağla</button>
  <p class="small">Bu sürümde yalnızca bu telefona senkronize edilen butonlar görünür. Sunucu bağlantısı sonraki adım.</p>
</main>`;
};
SCREENS.clinList.after = () => { knownCodes().forEach(c => { if (!DAYCACHE[c]) computeDays(c).then(refresh); }); };
SCREENS.clinPatient = p => {
  const code = p.code, P = profiles(), prof = P[code] || {}, g = prof.goal || 16, goalMs = g * 3.6e6, s = summary(code);
  const days = daysList(code, 14), model = getModel(code), meta = getMeta(code);
  const hist = (prof.goalHistory || []).slice().reverse().map(h => `<div class="li"><span class="k">${h.to} sa</span><span class="v">${h.by === 'clinician' ? 'klinisyen' : 'aile'} · ${fmtDate(h.at)}</span></div>`).join('');
  const isLive = B.connected && B.info && B.info.code === code;
  return `<main>${backBtn('clinList', 'Hastalarım')}
  <h1>${esc(code)}</h1>
  <div class="grid2"><div class="card stat"><span>14 gün ortalama</span><b>${fmtH1(s.avg)} sa</b></div><div class="card stat"><span>Hedef</span><b>${g} sa</b></div></div>
  ${s.uneven ? '<div class="note"><b>Düzensiz</b>Son 14 günde günlük süreler arasında büyük fark var.</div>' : ''}
  <section class="card"><b>Son 14 gün</b>${barsSvg(days, goalMs, 1)}</section>
  <section class="card"><b>Haftalık harita</b><p class="small" style="margin:4px 0 8px">Son 7 gün, takılı saatler mavi.</p>${weekMapSvg(days.slice(7))}</section>
  <section class="card"><div class="row"><b>Hedefi değiştir</b></div><div class="stepper" style="margin-top:10px"><button data-act="clinGoal" data-arg="-1" aria-label="Azalt">–</button><b>${g} saat</b><button data-act="clinGoal" data-arg="1" aria-label="Artır">+</button></div><p class="small" style="margin-top:8px">Değişiklik aileye bildirilir ve 3 gün boyunca ana ekranda görünür.</p></section>
  <section class="card list"><div class="li"><span class="k">Hedef geçmişi</span><span></span></div>${hist || '<p class="small">Henüz değişiklik yok.</p>'}</section>
  <section class="card list">
    <div class="li"><span class="k">Kalibrasyon</span><span class="v">${model ? fmtDate(model.createdAt) + ' · ' + (model.by === 'clinician' ? 'klinisyen' : 'aile') : 'yapılmadı'}</span></div>
    <div class="li"><span class="k">Son senkron</span><span class="v">${ago(meta.lastSync)}</span></div>
    <div class="li"><span class="k">Pil</span><span class="v">${esc(battery(code).txt)}</span></div>
  </section>
  ${isLive ? '' : `<button class="btn secondary" data-act="clinConnect">Butona bağlan ve senkronize et</button>`}
  <button class="btn primary" data-act="calOpen" data-arg="clinician" ${isLive ? '' : 'disabled'}>Kalibrasyon yap</button>
  <button class="btn text" data-act="openRaw" data-arg="${esc(code)}" style="align-self:center">Ham veri (geliştirici)</button>
</main>`;
};
SCREENS.clinPatient.after = p => { if (!DAYCACHE[p.code]) computeDays(p.code).then(refresh); };
SCREENS.raw = p => {
  const code = p.code, meta = getMeta(code), model = getModel(code), r = B.live && B.live.code === code ? B.live : null;
  return `<main>${backBtn('clinPatient', code)}
  <h1>Ham veri</h1>
  <div class="note"><b>Geliştirici ekranı</b>Ailelere gösterilmez.</div>
  <section class="card grid2">
    <div class="stat"><span>Ten tarafı</span><b>${r && r.skin !== null ? r.skin.toFixed(2) + ' °C' : '–'}</b></div>
    <div class="stat"><span>Nem</span><b>${r && r.rh !== null ? Math.round(r.rh) + ' %' : '–'}</b></div>
    <div class="stat"><span>Çip (kapak)</span><b>${r ? r.chip.toFixed(1) + ' °C' : '–'}</b></div>
    <div class="stat"><span>Besleme</span><b>${meta.mv ? (meta.mv / 1000).toFixed(2) + ' V' : '–'}</b></div>
  </section>
  <section class="card"><b>Son 6 saat</b><div id="rawChart">${RAWCHART.code === code && RAWCHART.html ? RAWCHART.html : '<p class="small">Yükleniyor…</p>'}</div></section>
  <section class="card small">${model ? `Kalibrasyon: oda ${model.Toff.toFixed(2)} °C, takılı ${model.Ton.toFixed(2)} °C, eşik ≥${model.thrOn.toFixed(2)} / ≤${model.thrOff.toFixed(2)} °C, τ ısınma ${Math.round(model.tauOn)} s, τ soğuma ${Math.round(model.tauOff)} s` : 'Kalibrasyon yok: varsayılan eşikler (29,7 / 27,8 °C) kullanılıyor.'}<br>Yazılım: ${esc(meta.fw || '–')} · sıradaki kayıt: ${meta.next}</section>
  <div class="grid2"><button class="btn secondary" data-act="csvDay" data-arg="${esc(code)}">24 saat CSV</button><button class="btn secondary" data-act="csvCal" data-arg="${esc(code)}">Kalibrasyon CSV</button></div>
  <section class="card"><b>Bluetooth günlüğü</b><pre class="log">${esc(APP_VERSION + '\n' + B.log.join('\n'))}</pre></section>
</main>`;
};
const RAWCHART = { code: null, html: '', at: 0 };
SCREENS.raw.after = async p => {
  if (RAWCHART.code === p.code && Date.now() - RAWCHART.at < 10000) return;   // redraw at most every 10 s
  RAWCHART.code = p.code; RAWCHART.at = Date.now();
  const recs = (await getRecs(p.code, Date.now() - 6 * 3.6e6, Date.now() + 60e3)).filter(r => r.skin !== null);
  const el = $('#rawChart'); if (!el) return;
  if (recs.length < 2) { RAWCHART.html = el.innerHTML = '<p class="small">Veri yok.</p>'; return; }
  const model = modelFor(p.code), W = 340, H = 140, t0 = Date.now() - 6 * 3.6e6;
  const step = Math.max(1, Math.floor(recs.length / 400)), pts = recs.filter((_, i) => i % step === 0);
  const lo = Math.min(model.thrOff - 2, ...pts.map(r => r.skin)), hi = Math.max(model.thrOn + 2, ...pts.map(r => r.skin));
  const X = t => (W * (t - t0) / (6 * 3.6e6)).toFixed(1), Y = v => (H - 8 - (H - 16) * (v - lo) / (hi - lo)).toFixed(1);
  RAWCHART.html = el.innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Son 6 saatlik sıcaklık"><line x1="0" x2="${W}" y1="${Y(model.thrOn)}" y2="${Y(model.thrOn)}" stroke="#0B1F44" stroke-dasharray="4 4"/><line x1="0" x2="${W}" y1="${Y(model.thrOff)}" y2="${Y(model.thrOff)}" stroke="#5B6987" stroke-dasharray="2 4"/><polyline fill="none" stroke="#1E5EFF" stroke-width="2" points="${pts.map(r => X(r.t) + ',' + Y(r.skin)).join(' ')}"/><text x="2" y="12" font-size="10" fill="#5B6987">${hi.toFixed(1)} °C</text><text x="2" y="${H - 2}" font-size="10" fill="#5B6987">${lo.toFixed(1)} °C</text></svg>`;
};

// ================= actions =================
const ACTIONS = {
  go: s => go(s, s === 'clinPatient' || s === 'raw' ? params : {}),
  connect: async () => {
    await bleConnect();
    if (session && session.role === 'family' && B.info && B.info.code && B.info.code !== session.code) alert(`Bu buton (${B.info.code}) senin hesabına ait değil. Kendi butonuna bağlan.`);
  },
  famStart: () => { const P = profiles(); if (session && session.role === 'family' && P[session.code]) return go('famHome'); go(Object.keys(P).length ? 'famLogin' : 'famConnect'); },
  famConnectBtn: async () => {
    const ok = await bleConnect(); if (!ok || !B.info) return;
    const code = B.info.code, P = profiles();
    if (P[code]) { toast('Bu butonun hesabı var. Giriş yap.'); go('famLogin'); return; }
    go('famPass', { code });
  },
  famPassSave: async () => {
    const a = $('#pw1').value, b = $('#pw2').value;
    if (a.length < 8) { $('#err').textContent = 'Şifre en az 8 karakter olmalı.'; return; }
    if (a !== b) { $('#err').textContent = 'Şifreler aynı değil.'; return; }
    const salt = randHex(16);
    params.pw = { salt, hash: await sha256hex(salt + ':' + params.code + ':' + a) };
    go('famConsent', params);
  },
  famConsentSave: () => {
    if (!$('#ok1').checked || !$('#ok2').checked) { toast('Devam etmek için iki kutuyu da işaretle.'); return; }
    params.consentAt = Date.now(); go('famGoal', params);
  },
  goalStep: d => { params.goal = Math.min(23, Math.max(1, (params.goal || 16) + +d)); $('#gv').textContent = params.goal + ' saat'; },
  famGoalSave: () => {
    const P = profiles(), goal = params.goal || 16;
    P[params.code] = { pwSalt: params.pw.salt, pwHash: params.pw.hash, consentAt: params.consentAt, consentVersion: 'v1-taslak', goal, goalHistory: [{ to: goal, by: 'family', at: Date.now() }], createdAt: Date.now() };
    saveProfiles(P);
    const m = getMeta(params.code); if (!m.firstSeen) m.firstSeen = Date.now(); setMeta(params.code, m);
    session = { role: 'family', code: params.code }; ssSet('sk.session', session);
    CAL.phase = null; CAL.code = params.code; CAL.by = 'family';
    go('calib');
  },
  famLoginBtn: async () => {
    const code = $('#lc').value.trim().toUpperCase(), pw = $('#lp').value, P = profiles();
    if (!P[code]) { $('#err').textContent = 'Bu buton kodu bu telefonda kayıtlı değil.'; return; }
    if (await sha256hex(P[code].pwSalt + ':' + code + ':' + pw) !== P[code].pwHash) { $('#err').textContent = 'Şifre hatalı.'; return; }
    session = { role: 'family', code }; ssSet('sk.session', session); go('famHome');
  },
  forgot: () => alert('Şifreleri yalnızca SkoliData sıfırlayabilir. Bize ulaş.'),
  famGoalAdj: d => { const P = profiles(), p = P[session.code]; const to = Math.min(23, Math.max(1, (p.goal || 16) + +d)); if (to === p.goal) return; p.goalHistory = (p.goalHistory || []).concat({ from: p.goal, to, by: 'family', at: Date.now() }); p.goal = to; saveProfiles(P); render(); },
  showConsent: () => go('consentView'),
  logout: () => { session = null; ssSet('sk.session', null); go('login'); },
  famDelete: async () => {
    if (!confirm('Bu telefondaki hesabın ve tüm ölçümler silinecek. Emin misin?')) return;
    const c = session.code, P = profiles(); delete P[c]; saveProfiles(P);
    ['sk.meta.', 'sk.model.', 'sk.days.', 'sk.calraw.', 'sk.calhist.'].forEach(k => lsDel(k + c));
    await deleteCode(c); delete DAYCACHE[c];
    session = null; ssSet('sk.session', null); go('login'); toast('Silindi.');
  },
  calOpen: by => { CAL.by = by; CAL.code = by === 'clinician' ? params.code : session.code; CAL.phase = null; CAL.result = null; go('calib', params); },
  calStart: () => {
    if (!B.connected || !B.info) return;
    if (B.info.code !== CAL.code) { alert(`Bağlı buton (${B.info.code}) bu hesaba ait değil (${CAL.code}).`); return; }
    CAL.buf = { off: [], on: [] }; CAL.phase = 'off'; CAL.start = Date.now(); calTick(); render();
  },
  calOnStart: () => { CAL.phase = 'on'; CAL.start = Date.now(); CAL.buf.on = []; calTick(); render(); },
  calCancel: () => { clearTimeout(CAL.timer); CAL.phase = null; render(); },
  calReset: () => { CAL.phase = null; CAL.result = null; render(); },
  clinLoginBtn: async () => {
    const u = $('#cu').value.trim().toLowerCase(), pw = $('#cp').value, c = CLINICIANS.find(x => x.u === u);
    if (!c || await sha256hex(c.salt + ':' + c.u + ':' + pw) !== c.hash) { $('#err').textContent = 'Kullanıcı adı veya şifre hatalı.'; return; }
    session = { role: 'clinician', u }; ssSet('sk.session', session); go('clinList');
  },
  clinConnect: async () => {
    const ok = await bleConnect(); if (!ok || !B.info) return;
    const code = B.info.code, m = getMeta(code); if (!m.firstSeen) { m.firstSeen = Date.now(); setMeta(code, m); }
    go('clinPatient', { code });
  },
  openPatient: c => go('clinPatient', { code: c }),
  openRaw: c => go('raw', { code: c }),
  clinGoal: d => {
    const P = profiles(), code = params.code, p = P[code] || (P[code] = { goal: 16, goalHistory: [] });
    const from = p.goal || 16, to = Math.min(23, Math.max(1, from + +d)); if (to === from) return;
    p.goal = to; p.goalHistory = (p.goalHistory || []).concat({ from, to, by: 'clinician', at: Date.now() }); p.goalNote = { from, to, at: Date.now() };
    saveProfiles(P); render(); toast(`Yeni hedef: ${to} saat. Aileye bildirildi.`);
  },
  csvDay: async c => {
    const recs = await getRecs(c, Date.now() - 864e5, Date.now() + 60e3);
    const t0 = recs.length ? recs[0].t : 0;
    download(`skolidata_${c}_24h.csv`, 'time_s,skin_C,humidity_pct,chip_C,wall_time\n' + recs.map(r => `${((r.t - t0) / 1000).toFixed(0)},${r.skin ?? ''},${r.rh ?? ''},${r.chip},${new Date(r.t).toISOString()}`).join('\n'));
  },
  csvCal: c => {
    const raw = lsGet('sk.calraw.' + c, null); if (!raw) { toast('Kayıtlı kalibrasyon yok.'); return; }
    const t0 = (raw.off[0] || raw.on[0] || [0])[0], line = ph => r => `${((r[0] - t0) / 1000).toFixed(0)},${r[1] ?? ''},${r[2] ?? ''},${ph}`;
    download(`skolidata_${c}_calibration.csv`, 'time_s,skin_C,humidity_pct,phase\n' + raw.off.map(line('off')).concat(raw.on.map(line('on'))).join('\n'));
  },
};
function download(name, text) {
  try { navigator.clipboard && navigator.clipboard.writeText(text); } catch (e) {}
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  toast('CSV indirildi ve panoya kopyalandı.');
}

// ================= start =================
if (session && session.role === 'family' && profiles()[session.code]) screen = 'famHome';
else if (session && session.role === 'clinician') screen = 'clinList';
render();
setInterval(() => { if (screen === 'famHome' || screen === 'clinPatient') { const c = screen === 'famHome' ? session && session.code : params.code; if (c && B.connected) computeDays(c, 2).then(() => { refresh(); }); } }, 60000);
</script>
</body>
