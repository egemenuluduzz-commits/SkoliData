<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1E5EFF">
<meta name="robots" content="noindex, nofollow">

<title>SkoliData</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
:root{--blue:#1E5EFF;--deep:#1748D6;--light:#5AA2FF;--pale:#E8F1FF;--navy:#0B1F44;--slate:#5B6987;--ground:#F3F6FC;--line:#DCE4F2;--soft:#A9C8FF;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--navy);font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:460px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 28px);display:flex;flex-direction:column;gap:14px;min-height:100vh}
h1{margin:0;font-size:32px;font-weight:800;letter-spacing:-.02em}
h2{margin:0;font-size:20px;font-weight:800}
p{margin:0;line-height:1.45}
.sub{font-size:15px;font-weight:600;color:var(--slate)}
.card{background:var(--white);border:1px solid #E4EBF7;border-radius:22px;padding:16px;box-shadow:0 1px 2px rgba(11,31,68,.04),0 8px 24px rgba(11,31,68,.05)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border-radius:16px;border:none;font:700 17px 'Plus Jakarta Sans',system-ui,sans-serif;cursor:pointer;padding:0 16px;text-decoration:none}
.btn:disabled{opacity:.45;cursor:default}
.primary{background:var(--blue);color:#fff}
.secondary{background:#fff;color:var(--deep);border:1.5px solid #C9D8F8}
.text{background:none;color:var(--deep);min-height:44px;width:auto;padding:0 6px}
.korsem{min-height:76px;border-radius:24px;background:linear-gradient(135deg,#3D7DFF 0%,#1E5EFF 55%,#1646D0 100%);color:#fff;font-size:24px;font-weight:800;box-shadow:0 14px 30px rgba(30,94,255,.3)}
.klinisyen{min-height:76px;border-radius:24px;background:#fff;color:var(--navy);border:2px solid var(--blue);font-size:22px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.back{background:none;border:none;color:var(--deep);font:700 17px 'Plus Jakarta Sans',system-ui;display:flex;align-items:center;gap:4px;min-height:44px;padding:0;cursor:pointer}
.pill{align-self:center;display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 18px;border-radius:22px;background:#fff;border:1px solid #E4EBF7;font-weight:700;font-size:16px;text-align:center}
.dot{width:10px;height:10px;border-radius:5px;background:var(--blue);box-shadow:0 0 0 4px rgba(30,94,255,.18);flex:none}
.dot.off{background:none;border:2px solid var(--slate);box-shadow:none}
.dot.wait{background:var(--soft);box-shadow:none}
.ringwrap{position:relative;width:220px;height:220px;align-self:center}
.ringwrap svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.big{font-weight:800;letter-spacing:-.03em;display:flex;align-items:baseline;gap:3px}
.big b{font-size:40px;line-height:1}.big i{font-style:normal;font-size:18px;margin-right:5px}
.goal{font-size:15px;font-weight:700;color:var(--slate)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.wd{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--slate)}
.wd span:first-child{width:32px;height:32px;border-radius:16px;border:2px dashed var(--line)}
.wd.done span:first-child{background:var(--blue);border:none}
.wd.miss span:first-child{border:2.5px solid var(--soft)}
.wd.today span:first-child{border:2.5px solid var(--blue);display:flex;align-items:center;justify-content:center}
.wd.today.done span:first-child{border:none}
.wd.today span:first-child::after{content:'';width:10px;height:10px;border-radius:5px;background:var(--blue)}
.wd.today.done span:first-child::after{background:#fff}
.wd.today{color:var(--navy);font-weight:800}
.upd{text-align:center;font-size:14px;font-weight:600;color:var(--slate)}
.note{background:var(--pale);border:1px solid #D3E2FD;border-radius:20px;padding:14px 16px;font-size:15px;line-height:1.45;color:#34446A}
.note b{display:block;color:var(--navy);margin-bottom:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat span{display:block;font-size:13px;font-weight:700;color:var(--slate)}.stat b{font-size:22px;font-weight:800}
.small{font-size:13px;color:var(--slate);line-height:1.45}
.center{text-align:center}
.mark{width:84px;height:84px;border-radius:42px;background:linear-gradient(135deg,var(--light),var(--blue));display:flex;align-items:center;justify-content:center;align-self:center;box-shadow:0 12px 30px rgba(30,94,255,.28)}
.mark span{width:32px;height:32px;border-radius:16px;border:5px solid #fff}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:700;color:var(--slate)}
input.in{height:54px;border-radius:14px;border:1.5px solid var(--line);padding:0 14px;font:600 17px 'Plus Jakarta Sans',system-ui;color:var(--navy);background:#fff;width:100%}
input.in:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 4px rgba(30,94,255,.12)}
.err{color:var(--deep);font-weight:700;font-size:14px;min-height:20px}
.stepper{display:flex;align-items:center;justify-content:space-between}
.stepper button{width:48px;height:48px;border-radius:24px;border:none;background:var(--pale);color:var(--deep);font:800 24px system-ui;cursor:pointer}
.stepper b{font-size:26px;font-weight:800}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px 0;border-bottom:1px solid #EEF2F9;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer}
.li:last-child{border-bottom:none}
.li .k{font-weight:700}.li .v{color:var(--slate);font-weight:600;font-size:15px;text-align:right}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--pale);color:var(--deep);border-radius:12px;padding:4px 10px;font-size:13px;font-weight:700}
.check{display:flex;gap:12px;align-items:flex-start;font-weight:600;font-size:15px;line-height:1.4;cursor:pointer}
.check input{width:24px;height:24px;accent-color:var(--blue);flex:none;margin:0}
.gauge{display:flex;gap:4px}.gauge i{flex:1;height:10px;border-radius:5px;background:var(--line)}.gauge i.on{background:var(--blue)}
pre.log{white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.4;margin:8px 0 0;max-height:200px;overflow:auto;background:var(--ground);border-radius:12px;padding:10px}
svg.chart{width:100%;height:auto;display:block}
.timer{font-size:56px;font-weight:800;letter-spacing:-.03em;text-align:center;font-variant-numeric:tabular-nums}
.steps{display:flex;gap:8px;justify-content:center}.steps i{width:28px;height:6px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--blue)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:15px;max-width:90vw;z-index:9}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="skolidata-algo.js"></script>
<script>
'use strict';
const APP_VERSION = 'app v1.1 · algo v1';
const NUS = '6e400001-b5a3-f393-e0a9-e50e24dcca9e', NUS_RX = '6e400002-b5a3-f393-e0a9-e50e24dcca9e', NUS_TX = '6e400003-b5a3-f393-e0a9-e50e24dcca9e';
// Clinician accounts: only a salted SHA-256 of the password is stored here (never the password itself).
// NOTE: this is a front door for testing, not real security; real accounts need the server (master plan §6-7).
const CLINICIANS = [{ u: 'klinisyen', salt: '5421f45dc65f8046e7b1231c5b5fc80f', hash: 'e4a095d63996a4ced0aa39f2d3f0633b469adc340db00dc81c4b7dc6f3d909c1', name: 'Klinisyen' }];
const DEFAULT_MODEL = { version: 1, createdAt: 0, isDefault: true, Toff: 24, Ton: 33.5, gap: 9.5, thrOn: 29.7, thrOff: 27.8, tauOn: 100, tauOff: 150, lagOn: 92, lagOff: 137 };
const DAYS_TR = ['Pz', 'Pt', 'Sa', 'Ça', 'Pe', 'Cu', 'Ct'];
const MONTHS_TR = ['Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
const WEEKDAYS_TR = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];

// ================= small helpers =================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const mem = {};
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (k in mem ? mem[k] : d); } catch (e) { return k in mem ? mem[k] : d; } }
function lsSet(k, v) { mem[k] = v; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function lsDel(k) { delete mem[k]; try { localStorage.removeItem(k); } catch (e) {} }
function ssGet(k) { try { return JSON.parse(sessionStorage.getItem(k)); } catch (e) { return mem['ss' + k] || null; } }
function ssSet(k, v) { mem['ss' + k] = v; try { sessionStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function waitFor(pred, ms) { const end = Date.now() + ms; while (Date.now() < end) { if (pred()) return true; await sleep(50); } return !!pred(); }
const startOfDay = t => { const d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); };
const addDays = (t, n) => { const d = new Date(t); d.setDate(d.getDate() + n); return d.getTime(); };
const dateKey = t => { const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fmtHM = ms => { const h = Math.floor(ms / 3.6e6), m = Math.floor((ms % 3.6e6) / 6e4); return `${h} sa ${m} dk`; };
const fmtH1 = ms => (ms / 3.6e6).toFixed(1).replace('.', ',');
const fmtDate = t => { const d = new Date(t); return `${d.getDate()} ${MONTHS_TR[d.getMonth()]}`; };
function ago(t) { if (!t) return 'henüz yok'; const s = (Date.now() - t) / 1000; if (s < 60) return 'az önce'; if (s < 3600) return Math.floor(s / 60) + ' dk önce'; if (s < 86400) return Math.floor(s / 3600) + ' sa önce'; return Math.floor(s / 86400) + ' gün önce'; }
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
async function sha256hex(s) {
  const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s));
  return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
}
const randHex = n => [...crypto.getRandomValues(new Uint8Array(n))].map(x => x.toString(16).padStart(2, '0')).join('');

// ================= storage =================
// small things in localStorage; readings in IndexedDB (falls back to memory)
const profiles = () => lsGet('sk.profiles', {});
const saveProfiles = p => lsSet('sk.profiles', p);
const getMeta = code => lsGet('sk.meta.' + code, { next: 0, lastSync: 0, mv: 0, firstSeen: Date.now() });
const setMeta = (code, m) => lsSet('sk.meta.' + code, m);
const getModel = code => lsGet('sk.model.' + code, null);
const modelFor = code => getModel(code) || DEFAULT_MODEL;

let DB = null, memRecs = null;
function idb() {
  return new Promise((res) => {
    if (DB || memRecs) return res(DB);
    try {
      const r = indexedDB.open('skolidata', 1);
      r.onupgradeneeded = () => { const st = r.result.createObjectStore('recs', { keyPath: ['code', 'idx'] }); st.createIndex('byTime', ['code', 't']); };
      r.onsuccess = () => { DB = r.result; res(DB); };
      r.onerror = () => { memRecs = []; res(null); };
    } catch (e) { memRecs = []; res(null); }
  });
}
async function putRecs(list) {
  if (!list.length) return;
  const db = await idb();
  if (!db) { memRecs.push(...list); return; }
  await new Promise((res) => { const tx = db.transaction('recs', 'readwrite'), st = tx.objectStore('recs'); list.forEach(r => st.put(r)); tx.oncomplete = res; tx.onerror = res; });
  // readings arrived for these days -> their cached hours must be recomputed
  const byCode = {};
  list.forEach(r => { byCode[r.code] = Math.min(byCode[r.code] ?? Infinity, r.t); });
  for (const c in byCode) { const k = dateKey(byCode[c]), cache = lsGet('sk.days.' + c, {}); for (const d in cache) if (d >= k) delete cache[d]; lsSet('sk.days.' + c, cache); }
}
async function getRecs(code, t0, t1) {
  const db = await idb();
  if (!db) return memRecs.filter(r => r.code === code && r.t >= t0 && r.t <= t1).sort((a, b) => a.t - b.t);
  return new Promise((res) => { const q = db.transaction('recs').objectStore('recs').index('byTime').getAll(IDBKeyRange.bound([code, t0], [code, t1])); q.onsuccess = () => res(q.result); q.onerror = () => res([]); });
}
async function deleteCode(code) {
  const db = await idb();
  if (!db) { memRecs = memRecs.filter(r => r.code !== code); return; }
  await new Promise((res) => { const tx = db.transaction('recs', 'readwrite'); tx.objectStore('recs').delete(IDBKeyRange.bound([code, 0], [code, Number.MAX_SAFE_INTEGER])); tx.oncomplete = res; tx.onerror = res; });
}

// ================= Bluetooth (protocol 2) =================
const B = { device: null, rx: null, connected: false, info: null, chunk: null, syncing: false, live: null, log: [], writeQ: Promise.resolve(), rxBuf: new Uint8Array(0), binLeft: 0 };
function blog(t) { B.log.push(new Date().toLocaleTimeString('tr-TR') + '  ' + t); if (B.log.length > 40) B.log.shift(); }
function send(cmd) {
  blog('→ ' + cmd);
  B.writeQ = B.writeQ.then(() => B.rx ? B.rx.writeValue(new TextEncoder().encode(cmd + '\n')) : null).catch(e => blog('write error ' + e.message));
  return B.writeQ;
}
async function bleConnect() {
  if (!navigator.bluetooth) { alert("Bu tarayıcı Bluetooth'a bağlanamıyor. iPhone'da ücretsiz \"Bluefy\" uygulamasıyla, Android'de Chrome ile aç."); return false; }
  try {
    const dev = await navigator.bluetooth.requestDevice({ filters: [{ namePrefix: 'SK-' }, { services: [NUS] }], optionalServices: [NUS] });
    B.device = dev; B.live = null;
    dev.addEventListener('gattserverdisconnected', () => {
      if (dev !== B.device) return;            // an older button we already left
      B.connected = false; B.syncing = false; blog('bağlantı koptu');
      if (CAL.phase === 'off' || CAL.phase === 'on') calFail('Bağlantı koptu. Telefonu butona yakın tut ve tekrar dene.');
      refresh();
    });
    const server = await B.device.gatt.connect();
    const svc = await server.getPrimaryService(NUS);
    const tx = await svc.getCharacteristic(NUS_TX);
    B.rx = await svc.getCharacteristic(NUS_RX);
    tx.addEventListener('characteristicvaluechanged', ev => { const v = ev.target.value; onBytes(new Uint8Array(v.buffer.slice(v.byteOffset, v.byteOffset + v.byteLength))); });
    await tx.startNotifications();
    B.connected = true; B.rxBuf = new Uint8Array(0); B.binLeft = 0;
    blog('bağlandı: ' + (B.device.name || ''));
    refresh();
    return await syncAll();
  } catch (e) {
    if (e && e.name !== 'NotFoundError') alert('Bağlanamadı: ' + e.message);
    B.connected = !!(B.device && B.device.gatt && B.device.gatt.connected);
    refresh();
    return false;
  }
}
function onBytes(u8) {
  const nb = new Uint8Array(B.rxBuf.length + u8.length); nb.set(B.rxBuf); nb.set(u8, B.rxBuf.length); B.rxBuf = nb;
  for (;;) {
    if (B.binLeft > 0) {
      const n = Math.min(B.binLeft, B.rxBuf.length - (B.rxBuf.length % 8));
      if (n < 8) break;
      const dv = new DataView(B.rxBuf.buffer, B.rxBuf.byteOffset, n);
      for (let o = 0; o < n; o += 8) decodeRec(dv, o);
      B.rxBuf = B.rxBuf.slice(n); B.binLeft -= n;
      continue;
    }
    const i = B.rxBuf.indexOf(10);
    if (i < 0) break;
    const line = new TextDecoder().decode(B.rxBuf.slice(0, i)).trim();
    B.rxBuf = B.rxBuf.slice(i + 1);
    if (line) handleLine(line);
  }
}
function wallTime(secs) { return B.info.at - (B.info.up - secs) * 1000; }
function decodeRec(dv, o) {
  const c = B.chunk; const idx = c.from + c.got++;
  const t = dv.getUint32(o, true), skin = dv.getInt16(o + 4, true), rh2 = dv.getUint8(o + 6), chip2 = dv.getUint8(o + 7);
  if (t === 0xFFFFFFFF) return;
  if (t === 0xFFFFFFFE || t === 0xFFFFFFFD) { c.mv = skin & 0xFFFF; return; }   // boot / battery records
  if (idx < B.info.boot) { c.untimed++; return; }                              // from an earlier power-on we never synced
  c.recs.push({ code: B.info.code, idx, t: wallTime(t), skin: skin === -32768 ? null : skin / 100, rh: rh2 === 255 ? null : rh2 / 2, chip: chip2 / 2 - 20 });
}
function handleLine(line) {
  blog('← ' + (line.length > 90 ? line.slice(0, 90) + '…' : line));
  if (line.startsWith('SkoliData')) {
    const g = k => { const m = new RegExp('\\b' + k + '=(\\d+)').exec(line); return m ? +m[1] : null; };
    const code = (/SK-[0-9A-Z]{8}/.exec(line) || [''])[0], fw = (/fw[0-9.]+/.exec(line) || [''])[0];
    if (!/ p2 /.test(line + ' ')) { B.info = { code, fw, old: true, at: Date.now() }; return; }
    B.info = { code, fw, up: g('up'), every: g('every'), boot: g('boot'), first: g('first'), next: g('next'), mv: g('mv'), flash: g('flash'), at: Date.now() };
    return;
  }
  if (line.startsWith('D ')) { const p = line.split(' '); B.chunk = { from: +p[1], count: +p[2], got: 0, recs: [], untimed: 0, done: false }; B.binLeft = +p[2] * 8; return; }
  if (line === 'E') { if (B.chunk) finishChunk(); return; }
  if (line.startsWith('L,') && B.info && !B.info.old) {
    const p = line.split(',');
    const r = { code: B.info.code, idx: +p[1], t: wallTime(+p[2]), skin: p[3] === 'ERR' ? null : +p[3], rh: p[4] === 'ERR' ? null : +p[4], chip: +p[5] };
    B.live = r;
    putRecs([r]);
    const m = getMeta(r.code); if (m.next === r.idx) { m.next = r.idx + 1; setMeta(r.code, m); }
    if (CAL.phase === 'off' || CAL.phase === 'on') CAL.buf[CAL.phase].push(r);
    refresh();
  }
}
async function finishChunk() { const c = B.chunk; await putRecs(c.recs); c.done = true; }
async function syncAll() {
  B.info = null; B.syncing = true; refresh();
  for (let k = 0; k < 6 && !B.info; k++) { await send('i'); await waitFor(() => B.info, 1500); }
  if (!B.info) { B.syncing = false; toast('Buton yanıt vermedi.'); refresh(); return false; }
  if (B.info.old) { B.syncing = false; alert('Bu butonda eski yazılım var (' + B.info.fw + '). SkoliData_4_Button yazılımını yükle.'); refresh(); return false; }
  const code = B.info.code, meta = getMeta(code);
  let from = Math.max(meta.next || 0, B.info.first);
  for (let guard = 0; guard < 200; guard++) {
    B.chunk = null;
    await send('d' + from);
    const ok = await waitFor(() => B.chunk && B.chunk.done, 30000);
    if (!ok) { blog('aktarım yarım kaldı'); break; }
    if (B.chunk.mv) meta.mv = B.chunk.mv;
    from = B.chunk.from + B.chunk.count; meta.next = from; setMeta(code, meta);
    refresh();
    if (B.chunk.count < 4000) break;
  }
  meta.lastSync = Date.now(); meta.mv = B.info.mv || meta.mv; meta.fw = B.info.fw; setMeta(code, meta);
  B.syncing = false;
  await computeDays(code, 14, true);
  if (window.onSynced) { try { await window.onSynced(code); } catch (e) { blog('sunucu: ' + (e.message || e)); } }
  refresh();
  return true;
}

// ================= wear hours per day (cached for finished days) =================
const DAYCACHE = {};   // code -> {key -> day}
async function computeDays(code, nDays = 14, force) {
  const model = modelFor(code), meta = getMeta(code);
  const cache = lsGet('sk.days.' + code, {});
  const today0 = startOfDay(Date.now()), out = {};
  for (let d = nDays - 1; d >= 0; d--) {
    const a = addDays(today0, -d), b = addDays(today0, -d + 1), key = dateKey(a), isToday = d === 0;
    const c = cache[key];
    if (!isToday && c && c.modelAt === model.createdAt) { out[key] = c; continue; }
    const recs = await getRecs(code, a - 30 * 60e3, Math.min(b, Date.now() + 60e3));
    const prev = DAYCACHE[code] && DAYCACHE[code][key];
    if (recs.length <= 1 && prev && prev.fromServer) { out[key] = prev; continue; }
    const day = { key, start: a, ms: 0, unsureMs: 0, dataMs: 0, segs: [], n: 0, modelAt: model.createdAt };

      day.n = recs.filter(x => x.t >= a).length;

function battery(code) {
  const m = getMeta(code), mv = m.mv || 0;
  if (!mv) return { txt: 'Henüz bilinmiyor', seg: 0 };
  if (mv >= 3150) return { txt: 'USB ile çalışıyor', seg: 5 };
  const monthsUsed = (Date.now() - (m.firstSeen || Date.now())) / (30.4 * 864e5);
  if (mv < 2600) return { txt: 'Pil bitmek üzere. SkoliData ile iletişime geç.', seg: 1, low: true };
  if (mv < 2750) return { txt: 'Pil azalıyor. SkoliData ile iletişime geç.', seg: 2, low: true };
  const left = Math.max(1, Math.round(12 - monthsUsed));
  return { txt: `Yaklaşık ${left} ay kaldı`, seg: Math.max(3, Math.min(5, Math.ceil(left / 2.4))) };
}

function weekMapSvg(days) {
  const W = 340, rowH = 18, H = days.length * rowH + 20, x0 = 28, w = W - x0;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Korsenin günün hangi saatlerinde takıldığı">`;
  [0, 6, 12, 18, 24].forEach(h => s += `<text x="${x0 + w * h / 24}" y="${H - 4}" font-size="10" fill="#5B6987" text-anchor="${h === 24 ? 'end' : h === 0 ? 'start' : 'middle'}">${String(h).padStart(2, '0')}</text>`);
  days.forEach((d, i) => {
    const yy = i * rowH;
    s += `<text x="0" y="${yy + 13}" font-size="11" font-weight="700" fill="#5B6987">${DAYS_TR[new Date(d.start).getDay()]}</text><rect x="${x0}" y="${yy + 3}" width="${w}" height="${rowH - 6}" rx="4" fill="#E8F1FF"/>`;
    d.segs.forEach(([a, b]) => { const xa = x0 + w * (a - d.start) / 864e5, xb = x0 + w * (b - d.start) / 864e5; s += `<rect x="${xa.toFixed(1)}" y="${yy + 3}" width="${Math.max(1, xb - xa).toFixed(1)}" height="${rowH - 6}" rx="3" fill="#1E5EFF"/>`; });
  });
  return s + '</svg>';
}

function download(name, text) {

  toast('CSV indirildi ve panoya kopyalandı.');
}

async function sv(promise) { const { data, error } = await promise; if (error) throw error; return data; }
function busy(on) { document.querySelectorAll('button').forEach(b => { if (on) { b.dataset.wasDisabled = b.disabled; b.disabled = true; } else if (b.dataset.wasDisabled !== undefined) { b.disabled = b.dataset.wasDisabled === 'true'; delete b.dataset.wasDisabled; } }); }
SRV.loadMe = async () => {
  const { data } = await SRV.sb.auth.getSession();
  SRV.user = data && data.session ? data.session.user : null;
  if (!SRV.user) { SRV.profile = null; return null; }
  const rows = await sv(SRV.sb.from('profiles').select('*').eq('id', SRV.user.id));
  SRV.profile = rows[0] || null;
  return SRV.profile;
};
SRV.signIn = async (email, password) => { await sv(SRV.sb.auth.signInWithPassword({ email, password })); return SRV.loadMe(); };
SRV.signUp = async (email, password) => {
  const d = await sv(SRV.sb.auth.signUp({ email, password }));
  if (!d.session) await sv(SRV.sb.auth.signInWithPassword({ email, password }));   // if "confirm e-mail" is off this is not needed
  await SRV.loadMe();
};
SRV.signOut = async () => { try { await SRV.sb.auth.signOut(); } catch (e) {} SRV.user = null; SRV.profile = null; SRV.patients = []; };
SRV.rpc = (fn, args) => sv(SRV.sb.rpc(fn, args || {}));

// family: after every sync, upload the per-day hours and the button's health (never raw readings)
window.onSynced = async code => {
  if (!SRV.on || !SRV.profile || SRV.profile.role !== 'family' || SRV.profile.button_code !== code) return;
  const days = Object.values(DAYCACHE[code] || {}).filter(d => d.dataMs > 0 && !d.fromServer);
  const rows = days.map(d => ({ family_id: SRV.user.id, day: d.key, worn_min: Math.round(d.ms / 6e4), unsure_min: Math.round(d.unsureMs / 6e4),
    data_min: Math.min(1440, Math.round(d.dataMs / 6e4)), segments: d.segs.map(([a, b]) => [Math.round((a - d.start) / 6e4), Math.round((b - d.start) / 6e4)]),
    algo: 'v1', model_at: d.modelAt || 0, updated_at: new Date().toISOString() }));
  if (rows.length) await sv(SRV.sb.from('day_summaries').upsert(rows, { onConflict: 'family_id,day' }));
  const m = getMeta(code);
  await sv(SRV.sb.from('device_status').update({ mv: m.mv || null, fw: m.fw || null, flash: B.info ? !!B.info.flash : null,
    last_sync: new Date(m.lastSync || Date.now()).toISOString() }).eq('button_code', code));
  m.lastPush = Date.now(); setMeta(code, m);
};
// calibration result (both ok and failed) goes to the server; a clinician's result reaches the family's phone
window.onCalibrated = async (code, res, by) => {
  if (!SRV.on || !SRV.user || !SRV.profile) return;
  const fid = by === 'clinician' ? (profiles()[code] || {}).familyId : SRV.user.id;
  if (!fid || (by === 'family' && SRV.profile.button_code !== code)) return;
  const d = res.details || {};
  await sv(SRV.sb.from('calibrations').insert({ family_id: fid, by_role: by, by_id: SRV.user.id, ok: !!res.ok,
    toff: d.Toff ?? null, ton: d.Ton ?? null, tau_on: d.tauOn ?? null, tau_off: d.tauOff ?? null, model: res.ok ? res.model : null }));
  if (by === 'clinician') SRV.detail[code] = null;
};
// family: goal, goal note, clinicians and the newest calibration from the server
SRV.pullFamily = async (force) => {
  if (!SRV.on || !SRV.profile || SRV.profile.role !== 'family') return;
  if (!force && Date.now() - SRV.lastPull < 30000) return false;
  SRV.lastPull = Date.now();
  await SRV.loadMe();
  const code = SRV.profile.button_code, P = profiles(), p = P[code] || (P[code] = { createdAt: Date.now() });
  p.goal = SRV.profile.goal_h;
  const g = await sv(SRV.sb.from('goal_changes').select('*').eq('family_id', SRV.user.id).order('at', { ascending: false }).limit(20));
  p.goalHistory = g.slice().reverse().map(x => ({ from: x.from_h, to: x.to_h, by: x.by_role, at: Date.parse(x.at) }));
  p.goalNote = g[0] && g[0].by_role === 'clinician' ? { from: g[0].from_h, to: g[0].to_h, at: Date.parse(g[0].at) } : null;
  saveProfiles(P);
  SRV.clinicians = await SRV.rpc('my_clinicians');
  const cal = await sv(SRV.sb.from('calibrations').select('*').eq('family_id', SRV.user.id).eq('ok', true).order('created_at', { ascending: false }).limit(1));
  const local = getModel(code);
  if (cal[0] && cal[0].model && (!local || (cal[0].model.createdAt || 0) > (local.createdAt || 0))) {
    lsSet('sk.model.' + code, cal[0].model); lsSet('sk.days.' + code, {}); delete DAYCACHE[code];
  }
  return true;
};
// clinician: patients + their last 20 days of hours
SRV.loadPatients = async () => {
  SRV.patients = await SRV.rpc('clinician_patients');
  const ids = SRV.patients.map(x => x.family_id);
  const rows = ids.length ? await sv(SRV.sb.from('day_summaries').select('*').in('family_id', ids).gte('day', dateKey(addDays(startOfDay(Date.now()), -20)))) : [];
  const P = profiles();
  for (const pt of SRV.patients) {
    const code = pt.button_code, dc = DAYCACHE[code] = {};
    rows.filter(r => r.family_id === pt.family_id).forEach(r => {
      const day = String(r.day).slice(0, 10), start = new Date(day + 'T00:00:00').getTime();
      dc[day] = { key: day, start, ms: r.worn_min * 6e4, unsureMs: r.unsure_min * 6e4, dataMs: r.data_min * 6e4,
                    segs: (r.segments || []).map(([a, b]) => [start + a * 6e4, start + b * 6e4]), fromServer: true };
    });
    P[code] = Object.assign(P[code] || {}, { goal: pt.goal_h, familyId: pt.family_id, displayName: pt.display_name, remote: true });
    const m = getMeta(code);
    if (pt.last_sync) m.lastSync = Math.max(m.lastSync || 0, Date.parse(pt.last_sync));
    if (pt.mv) m.mv = pt.mv; if (pt.fw) m.fw = pt.fw;
    setMeta(code, m);
  }
  saveProfiles(P);
};
SRV.loadDetail = async code => {
  const fid = (profiles()[code] || {}).familyId; if (!fid) return;
  const g = await sv(SRV.sb.from('goal_changes').select('*').eq('family_id', fid).order('at', { ascending: false }).limit(20));
  const c = await sv(SRV.sb.from('calibrations').select('*').eq('family_id', fid).eq('ok', true).order('created_at', { ascending: false }).limit(1));
  SRV.detail[code] = { goals: g, cal: c[0] || null };
};
SRV.loadOwner = async () => {

  Object.assign(SRV.owner, { clinicians: c, health: h, cities: ci, audit: a, loaded: Date.now() });
};
async function routeAfterLogin() {
  const p = SRV.profile;
  if (!p) return go('login');
  if (p.role === 'family') { session = { role: 'family', code: p.button_code }; ssSet('sk.session', session); await SRV.pullFamily(true); return go('famHome'); }
  session = { role: p.role === 'owner' ? 'owner' : 'clinician', u: SRV.user.email }; ssSet('sk.session', session);
  if (p.role === 'owner') { await SRV.loadOwner(); return go('owner'); }
  if (!p.approved) return go('clinPending');
  await SRV.loadPatients(); go('clinList');
}

  SCREENS.clinSignup = () => `<main>${backBtn('clinLogin')}
    <h1>Klinisyen hesabı</h1>
    <label class="f">Ad soyad (ailelerin göreceği)<input class="in" id="sn" placeholder="Dr. Ayşe Yılmaz"></label>
    <label class="f">Şehir<select class="in" id="scity">${cityOptions('')}</select></label>
    <label class="f">E-posta<input class="in" id="se" type="email" autocapitalize="none" autocomplete="username"></label>
    <label class="f">Şifre (en az 8 karakter)<input class="in" id="sp" type="password" autocomplete="new-password"></label>
    <p class="err" id="err"></p><div style="flex:1"></div>
    <button class="btn primary" data-act="clinSignupBtn">Hesap oluştur</button>
  </main>`;
  SCREENS.clinPending = () => `<main><div style="flex:1"></div>
    <div class="mark" aria-hidden="true"><span></span></div>
    <h1 class="center">Onay bekleniyor</h1>
    <p class="sub center">Hesabınız oluşturuldu. SkoliData ekibi onayladığında hastalarınızı görebilir ve klinisyen kodunuzu ailelere verebilirsiniz.</p>
    <div style="flex:1"></div>
    <button class="btn primary" data-act="clinRecheck">Yeniden kontrol et</button>
    <button class="btn secondary" data-act="logout">Çıkış</button></main>`;
  const baseClinList = SCREENS.clinList;
  SCREENS.clinList = () => {
    const code = SRV.profile && SRV.profile.clinician_code;
    const codeCard = code ? `<div class="note"><b>Klinisyen kodunuz: ${esc(code)}</b>Ailelere bu kodu verin. Aile uygulamada kodu girip onayladığında burada görünür.</div>` : '';
    return baseClinList().replace('<section class="card list">', codeCard + '<section class="card list">')
      .replace('Bu telefonda henüz kayıtlı buton yok. Klinikte butonu bağlayarak başla.', 'Henüz sizinle paylaşan aile yok. Kodunuzu ailelere verin.')
      .replace('<p class="small">Bu sürümde yalnızca bu telefona senkronize edilen butonlar görünür. Sunucu bağlantısı sonraki adım.</p>', '<button class="btn text" data-act="clinRefresh" style="align-self:center">Yenile</button>');
  };
  SCREENS.clinList.after = () => {};
  const baseClinPatient = SCREENS.clinPatient;
  SCREENS.clinPatient = p => {
    const d = SRV.detail[p.code];
    if (d && profiles()[p.code]) {
      const P = profiles(); P[p.code].goalHistory = d.goals.slice().reverse().map(x => ({ from: x.from_h, to: x.to_h, by: x.by_role, at: Date.parse(x.at) })); saveProfiles(P);
      if (d.cal && d.cal.model && !getModel(p.code)) lsSet('sk.model.' + p.code, d.cal.model);
    }
    const name = (profiles()[p.code] || {}).displayName;
    let html = baseClinPatient(p);
    if (name) html = html.replace(`<h1>${esc(p.code)}</h1>`, `<h1>${esc(name)}</h1><p class="sub" style="margin-top:-8px">${esc(p.code)}</p>`);
    if (d && d.cal) html = html.replace(/(<span class="k">Kalibrasyon<\/span><span class="v">)[^<]*/, `$1${fmtDate(Date.parse(d.cal.created_at))} · ${d.cal.by_role === 'clinician' ? 'klinisyen' : 'aile'}`);
    return html;
  };
  SCREENS.clinPatient.after = p => { if (SRV.detail[p.code] === undefined || SRV.detail[p.code] === null) { SRV.detail[p.code] = false; SRV.loadDetail(p.code).then(refresh).catch(e => toast(trErr(e))); } };
  ACTIONS.clinLoginBtn = async () => {
    const email = $('#cu').value.trim(), pw = $('#cp').value;
    busy(true);
    try {
      const p = await SRV.signIn(email, pw);
      if (!p) { go('clinSignup'); toast('Hesap bilgilerinizi tamamlayın.'); return; }
      if (p.role === 'family') { await SRV.signOut(); $('#err').textContent = 'Bu bir aile hesabı. Korsem kapısını kullanın.'; return; }
      await routeAfterLogin();
    } catch (e) { $('#err').textContent = trErr(e); } finally { busy(false); }
  };
  ACTIONS.clinSignupBtn = async () => {
    const name = $('#sn').value.trim(), city = $('#scity').value, email = $('#se').value.trim(), pw = $('#sp').value;
    if (name.length < 3) { $('#err').textContent = 'Adınızı yazın.'; return; }
    if (!city) { $('#err').textContent = 'Şehir seçin.'; return; }
    if (pw.length < 8) { $('#err').textContent = 'Şifre en az 8 karakter olmalı.'; return; }
    busy(true);
    try {
      if (!SRV.user) { try { await SRV.signUp(email, pw); } catch (e) { if (String(e.message).includes('already registered')) await SRV.signIn(email, pw); else throw e; } }
      if (!SRV.profile) await SRV.rpc('register_clinician', { p_name: name, p_city: city });
      await SRV.loadMe(); await routeAfterLogin();
    } catch (e) { $('#err').textContent = trErr(e); } finally { busy(false); }
  };
  ACTIONS.clinRecheck = async () => { try { await SRV.loadMe(); if (SRV.profile && SRV.profile.approved) await routeAfterLogin(); else toast('Henüz onaylanmadı.'); } catch (e) { toast(trErr(e)); } };
  ACTIONS.clinRefresh = async () => { try { await SRV.loadPatients(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.clinGoal = async d => {
    const code = params.code, p = profiles()[code] || {}, to = Math.min(23, Math.max(1, (p.goal || 16) + +d));
    try { await SRV.rpc('set_goal', { p_family: p.familyId, p_goal: to }); await SRV.loadPatients(); await SRV.loadDetail(code); render(); toast(`Yeni hedef: ${to} saat. Aileye bildirildi.`); }
    catch (e) { toast(trErr(e)); }
  };
  ACTIONS.clinConnect = async () => {
    const ok = await bleConnect(); if (!ok || !B.info) return;
    const code = B.info.code;
    if (!profiles()[code] || !profiles()[code].familyId) { toast('Bu buton sizinle paylaşılmamış. Aile önce kodunuzu girmeli.'); return; }
    go('clinPatient', { code });
  };

  // ---------- owner ----------
  SCREENS.owner = () => {
    const o = SRV.owner, pending = o.clinicians.filter(c => !c.approved), approved = o.clinicians.filter(c => c.approved);
    const stale = h => !h.last_sync || Date.now() - Date.parse(h.last_sync) > 3 * 864e5;
    const healthRow = h => `<div class="li"><span><span class="k">${esc(h.code)}</span><br><span class="small">${h.assigned ? 'ailede' : h.ticket_open ? 'kod bekliyor' : 'boşta'} · ${h.fw ? esc(h.fw) : '–'} · ${h.flash === false ? 'flash yok · ' : ''}${h.last_sync ? ago(Date.parse(h.last_sync)) : 'hiç senkron yok'}</span></span><span class="chip">${!h.assigned ? '⚪ boşta' : stale(h) ? '⚪ 3+ gün yok' : h.mv && h.mv < 2750 ? '🔵 pil az' : '🟢 çalışıyor'}</span></div>`;
    return `<main>
    <header class="row"><div><div class="sub">SkoliData yönetici</div><h1>Yönetim</h1></div><button class="btn text" data-act="logout">Çıkış</button></header>
    <section class="card list"><div class="li"><span class="k">Onay bekleyen klinisyenler</span><span class="v">${pending.length}</span></div>
      ${pending.map(c => `<div class="li"><span><span class="k">${esc(c.name)}</span><br><span class="small">${esc(c.email)} · ${esc(c.city || '')}</span></span><span style="display:flex;gap:4px"><button class="btn text" data-act="ownerApprove" data-arg="${c.id}">Onayla</button><button class="btn text" data-act="ownerReject" data-arg="${c.id}">Reddet</button></span></div>`).join('') || '<p class="small">Bekleyen yok.</p>'}
    </section>
    <section class="card list"><div class="li"><span class="k">Klinisyenler</span><span class="v">${approved.length}</span></div>
      ${approved.map(c => `<div class="li"><span><span class="k">${esc(c.name)}</span><br><span class="small">${esc(c.code || '')} · ${c.patients} aile</span></span></div>`).join('') || '<p class="small">Henüz yok.</p>'}
    </section>
    <section class="card"><b>Yeni buton kaydı</b><p class="small" style="margin:4px 0 8px">Mühürlemeden önce: butonu bağla (ya da kodunu yaz), tek kullanımlık kayıt kodunu oluştur, etiketi yazdır.</p>
      <label class="f">Buton kodu<input class="in" id="bc" placeholder="SK-XXXXXXXX" autocapitalize="characters" value="${esc(B.info && B.info.code || '')}"></label>
      <div class="grid2" style="margin-top:10px"><button class="btn secondary" data-act="ownerReadButton">Butonu bağla</button><button class="btn primary" data-act="ownerTicket">Kayıt kodu üret</button></div></section>
    <section class="card list"><div class="li"><span class="k">Buton sağlığı</span><span class="v">${o.health.length}</span></div>${o.health.map(healthRow).join('') || '<p class="small">Henüz buton yok.</p>'}</section>
    <section class="card list"><div class="li"><span class="k">Şehirler</span><span class="v">aile · klinisyen</span></div>${o.cities.map(c => `<div class="li"><span class="k">${esc(c.city)}</span><span class="v">${c.families} · ${c.clinicians}</span></div>`).join('') || '<p class="small">Veri yok.</p>'}<p class="small">1–4 arası sayılar gizlilik için "1-4" gösterilir.</p></section>
    <section class="card"><b>Aile verisi</b><p class="small" style="margin:4px 0 8px">Her görüntüleme erişim günlüğüne yazılır.</p>
      <label class="f">Buton kodu<input class="in" id="fc" placeholder="SK-XXXXXXXX" autocapitalize="characters"></label>
      <button class="btn secondary" data-act="ownerFamily" style="margin-top:10px">Saatleri göster</button>
      <div id="famOut"></div>
      <button class="btn text" data-act="ownerRelease" style="margin-top:6px">Butonu serbest bırak (geri geldi)</button></section>
    <section class="card list"><div class="li"><span class="k">Erişim günlüğü</span><span></span></div>${o.audit.slice(0, 15).map(a => `<div class="li"><span class="small">${new Date(a.at).toLocaleString('tr-TR')}</span><span class="v">${esc(a.action)}${a.detail && a.detail.code ? ' · ' + esc(a.detail.code) : ''}</span></div>`).join('') || '<p class="small">Boş.</p>'}</section>
    <button class="btn text" data-act="ownerRefresh" style="align-self:center">Yenile</button>
  </main>`;
  };
  SCREENS.ownerTicket = p => `<main>${backBtn('owner', 'Yönetim')}
    <h1>Kayıt kodu</h1>
    <section class="card center" id="label" style="display:flex;flex-direction:column;align-items:center;gap:8px">
      <div id="qr" style="width:180px;height:180px"></div>
      <b style="font-size:20px;letter-spacing:.06em">${esc(p.ticket.match(/.{4}/g).join('-'))}</b>
      <span class="small">${esc(p.code)} · skolidata</span></section>
    <div class="note"><b>Tek seferlik</b>Bu kod yalnızca şimdi gösterilir ve sunucuda saklanmaz. Etiketi şimdi yazdır ya da kodu not al.</div>
    <button class="btn primary" data-act="ownerPrint">Etiketi yazdır</button>
  </main>`;
  SCREENS.ownerTicket.after = p => {
    const url = location.origin + location.pathname + '?t=' + p.ticket;
    const draw = () => { const q = window.qrcode(0, 'M'); q.addData(url); q.make(); const el = $('#qr'); if (el) el.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); };
    if (window.qrcode) draw(); else { const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js'; s.onload = draw; s.onerror = () => { const el = $('#qr'); if (el) el.innerHTML = '<p class="small">Karekod yüklenemedi; kodu elle yaz.</p>'; }; document.head.appendChild(s); }
  };
  ACTIONS.ownerRefresh = async () => { try { await SRV.loadOwner(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.ownerApprove = async id => { try { const code = await SRV.rpc('owner_approve_clinician', { p_id: id, p_ok: true }); toast('Onaylandı: ' + code); await SRV.loadOwner(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.ownerReject = async id => { if (!confirm('Bu klinisyen onaylanmayacak. Emin misin?')) return; try { await SRV.rpc('owner_approve_clinician', { p_id: id, p_ok: false }); await SRV.loadOwner(); render(); } catch (e) { toast(trErr(e)); } };
  ACTIONS.ownerReadButton = async () => { const ok = await bleConnect(); if (ok && B.info) { render(); toast('Buton: ' + B.info.code); } };
  ACTIONS.ownerTicket = async () => {
    const code = $('#bc').value.trim().toUpperCase();
    if (!/^SK-[2-9A-HJ-NP-Z]{8}$/.test(code)) { toast('Buton kodu SK-XXXXXXXX biçiminde olmalı.'); return; }
    try { const r = await SRV.rpc('owner_create_buttons', { p_codes: [code] }); go('ownerTicket', { code: r[0].code, ticket: r[0].ticket }); SRV.loadOwner().catch(() => {}); }
    catch (e) { toast(trErr(e)); }
  };
  ACTIONS.ownerPrint = () => { const w = window.open('', '_blank'); if (!w) { window.print(); return; } w.document.write(`<!doctype html><meta charset="utf-8"><title>SkoliData etiket</title><body style="font-family:sans-serif;text-align:center">${$('#label').innerHTML}<script>setTimeout(()=>print(),300)<\/script></body>`); w.document.close(); };
  ACTIONS.ownerFamily = async () => {
    const code = $('#fc').value.trim().toUpperCase();
    try {
      const rows = await SRV.rpc('owner_family_overview', { p_code: code });
      $('#famOut').innerHTML = rows.length ? `<div class="list" style="margin-top:8px">${rows.map(r => `<div class="li"><span class="k">${esc(String(r.day).slice(0, 10))}</span><span class="v">${fmtH1(r.worn_min * 6e4)} sa / hedef ${r.goal_h}${r.unsure_min ? ' · emin değil ' + fmtH1(r.unsure_min * 6e4) : ''}</span></div>`).join('')}</div>` : '<p class="small">Veri yok.</p>';
      SRV.loadOwner().catch(() => {});
    } catch (e) { toast(trErr(e)); }
  };
  ACTIONS.ownerRelease = async () => {
    const code = $('#fc').value.trim().toUpperCase();
    if (!/^SK-[2-9A-HJ-NP-Z]{8}$/.test(code)) { toast('Buton kodu SK-XXXXXXXX biçiminde olmalı.'); return; }
    if (!confirm(code + ' aileden ayrılacak. Ailenin geçmiş saatleri hesabında kalır, ama bu butonla yeni veri gelmez. Emin misin?')) return;
    try { await SRV.rpc('owner_release_button', { p_code: code }); toast(code + ' serbest. Yeni aile için kayıt kodu üretebilirsin.'); await SRV.loadOwner(); render(); }
    catch (e) { toast(trErr(e)); }
  };
  LIVE.add('famConnect');
}

// ================= start =================
(async () => {
  if (SRV.on) {
    try { await SRV.loadMe(); } catch (e) {}
    if (SRV.profile && !PENDING_TICKET) { try { return await routeAfterLogin(); } catch (e) { toast(trErr(e)); } }
    if (PENDING_TICKET && !SRV.profile) { screen = 'famTicket'; params = { ticket: PENDING_TICKET }; }
    render();
    return;
  }
  if (session && session.role === 'family' && profiles()[session.code]) screen = 'famHome';
  else if (session && session.role === 'clinician') screen = 'clinList';
  render();
})();
setInterval(() => { if (screen === 'famHome' || screen === 'clinPatient') { const c = screen === 'famHome' ? session && session.code : params.code; if (c && B.connected) computeDays(c, 2).then(() => { refresh(); }); } }, 60000);
</script>
</body>
</html>
